<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>旅遊計畫</title>
<!-- leaflet.css 要放在自訂 <style> 之前，避免蓋掉我們對 .leaflet-div-icon 的樣式 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--bg:#f6f8fc;--card:#ffffff;--text:#18212f;--muted:#667085;--line:#e5eaf2;--chip:#eef2ff;--primary:#111827;--primary-soft:#eff6ff;--accent:#2563eb;--danger:#ef4444;--warn:#fde68a;--warn-bg:#fefce8}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#f8fbff,#f5f7fb);color:var(--text)}
.wrap{max-width:1900px;margin:0 auto;padding:20px}

/* Hero */
.hero{position:relative;background:linear-gradient(135deg,#0ea5e9,#2563eb 55%,#4f46e5);color:#fff;border-radius:28px;padding:28px;box-shadow:0 12px 28px rgba(37,99,235,.16)}
.hero-edit-btn{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.hero-edit-btn:hover{background:rgba(255,255,255,.3)}
body:not(.edit-mode) .hero-edit-btn{display:none}
.hero-top-actions{position:absolute;top:20px;right:20px;display:flex;gap:8px;align-items:center;z-index:1}
body.edit-mode .hero-top-actions{right:64px}
.hero-collapse-btn{height:36px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700}
.hero-collapse-btn:hover{background:rgba(255,255,255,.3)}
.hero-top-actions .edit-toggle{height:36px;padding:0 12px;font-size:13px}
.hero.collapsed{padding:18px 20px}
.hero.collapsed .hero-content{display:none}
.hero.collapsed h1{margin:0;font-size:24px;padding-right:200px}
.hero.collapsed .hero-edit-btn{display:none}
#tripEditContainer:empty{display:none}
#tripEditContainer{margin-top:16px}
.hero h1{margin:0 0 8px;font-size:34px}
.hero p{margin:0;opacity:.92}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.meta .box{background:rgba(255,255,255,.14);padding:14px 16px;border-radius:18px}
.hero-actions{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dropzone{flex:1;min-width:240px;border:2px dashed rgba(255,255,255,.5);border-radius:18px;padding:14px 18px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:.18s ease}
.dropzone.dragover{background:rgba(255,255,255,.18);border-color:#fff}
.drop-main{display:grid;gap:4px}
.drop-title{font-weight:800;font-size:14px}
.drop-sub{font-size:12px;opacity:.9}
.hidden-input{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--primary);color:#fff;padding:10px 14px;border-radius:12px;border:0;cursor:pointer;font-size:14px;font-weight:700}
.btn.secondary{background:white;color:#111827;border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn.ghost:hover{background:rgba(255,255,255,.28)}
.btn.danger{background:var(--danger)}
.status{display:inline-flex;align-items:center;padding:0 16px;border-radius:14px;background:rgba(255,255,255,.16);font-weight:700;font-size:13px;height:36px}

/* Main tabs */
.main-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0;padding:8px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 16px rgba(16,24,40,.05)}
.main-tab{flex:1;min-width:140px;padding:14px 20px;border-radius:14px;background:transparent;border:0;cursor:pointer;font-weight:700;font-size:15px;color:var(--muted);transition:.15s}
.main-tab:hover{color:var(--text)}
.main-tab.active{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.22)}

/* Panel */
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 4px 16px rgba(16,24,40,.05)}
.panel[hidden]{display:none}

/* Sub tabs */
.sub-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.sub-tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--text)}
.sub-tab.active{background:#111827;color:#fff;border-color:#111827}
.sub-tabs.secondary{margin-bottom:14px}
.sub-tabs.secondary .sub-tab{background:#f8fafc}
.sub-tabs.secondary .sub-tab.active{background:#2563eb;color:#fff;border-color:#2563eb}

/* Map shell - 列表在左、地圖在右 (sticky) */
.map-shell{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:stretch}
.map-shell .map-side{grid-column:1;grid-row:1}
.map-shell .map-frame-wrap{grid-column:2;grid-row:1;display:grid;gap:0;position:sticky;top:20px;height:100%}
.map-canvas{position:relative;width:100%;height:100%;min-height:560px;border-radius:18px;overflow:hidden;background:#f3f4f6;transition:height .25s ease}
/* 收藏夾模式下地圖放大，較容易一眼看到所有 marker */
.map-canvas.fav-canvas{height:min(78vh,760px)}
.map-canvas iframe,.map-canvas #leafletMap{position:absolute;inset:0;width:100%;height:100%;border:0}
.map-canvas[data-mode="leaflet"] iframe{display:none}
.map-canvas[data-mode="iframe"] #leafletMap{display:none}

/* 編號 marker (Leaflet) */
.leaflet-div-icon{background:transparent;border:0}
.num-marker{position:relative;width:32px;height:32px;background:#dc2626;color:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.num-marker > span{transform:rotate(45deg);display:inline-block;font-family:Segoe UI,Arial,sans-serif}
.num-marker.first{background:#10b981}
.num-marker.last{background:#7c3aed}
.leaflet-popup-content{font-family:Segoe UI,Arial,sans-serif;font-size:13px;line-height:1.5;margin:10px 12px}
.leaflet-popup-content a{color:#2563eb}
.leaflet-popup-content .pop-title{font-weight:800;font-size:14px;margin-bottom:4px}
.leaflet-popup-content .pop-meta{color:#6b7280;font-size:12px}

iframe{width:100%;height:560px;border:0;border-radius:18px;background:#f3f4f6}
.map-side{display:flex;flex-direction:column;min-height:0}
.map-side .sub-tabs{position:sticky;top:0;background:#fff;z-index:2;padding-bottom:4px;margin-bottom:12px}
#mapSubContent{display:grid;gap:12px;max-height:600px;overflow-y:auto;padding:4px 8px 4px 4px;scrollbar-gutter:stable}
#mapSubContent::-webkit-scrollbar{width:8px}
#mapSubContent::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
#mapSubContent::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* Item card */
.item-card{border:1px solid var(--line);background:#fafcff;border-radius:16px;padding:14px 16px;position:relative;transition:.15s}
.item-card.map-target{cursor:pointer}
.item-card.map-target:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(37,99,235,.06)}
.item-card.active-map{outline:2px solid #93c5fd;background:#eff6ff}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:.15s;padding:0}
.icon-btn:hover{color:var(--text);border-color:#94a3b8}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);background:#fef2f2}
.icon-btn svg{display:block}

/* Edit mode 開關控制 */
body:not(.edit-mode) .tools{display:none}
body:not(.edit-mode) .add-btn{display:none}
body.edit-mode .item-card{padding-right:78px}
body.edit-mode .day-header{padding-right:78px}
.edit-toggle.on{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent}

/* 儲存後閃光提示 */
@keyframes flashSaved{
  0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}
  60%{box-shadow:0 0 0 12px rgba(16,185,129,0)}
  100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}
}
.flash{animation:flashSaved 1s ease-out}

/* Tag chip */
.tag-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;font-size:12px;font-weight:600}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* 前往下一站按鈕 */
.next-btn{cursor:pointer;background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s;padding:6px 12px;border-radius:999px;font-size:13px;font-family:inherit}
.next-btn:hover{background:#fde68a;border-color:#f59e0b;transform:translateX(2px)}

/* 時程表 (Excel 風格) */
.schedule-wrap{overflow-x:auto;margin:0 -8px;padding:0 8px}
table.schedule{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed;min-width:760px}
.schedule col.col-group{width:60px}
.schedule col.col-hour{width:78px}
.schedule col.col-day{width:auto}
.schedule th,.schedule td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle;background:#fff}
.schedule thead th{background:#fef9c3;color:#854d0e;font-weight:800;padding:10px;font-size:14px;position:sticky;top:0;z-index:1}
.schedule thead th .day-sub{font-size:11px;font-weight:500;color:#6b7280;margin-top:2px}
.schedule .time-group{background:#fef3c7;color:#92400e;font-size:24px;font-weight:900;letter-spacing:4px}
.schedule .hour-cell{background:#fafafa;color:var(--muted);font-weight:600;font-size:12px;padding:4px 6px}
/* 半小時 row 的 :30 label 淡化，讓視覺仍以整點為主 */
.schedule .hour-cell.hour-half{color:#cbd5e1;font-size:11px;background:#fcfcfd}
.schedule .stop-cell{cursor:pointer;font-weight:600;transition:.15s;padding:10px 8px;line-height:1.5}
.schedule .stop-cell:hover{background:#eff6ff;outline:2px solid #93c5fd;outline-offset:-2px;position:relative;z-index:2}
.schedule .stop-cell-name{font-weight:800;color:#1f2937}
.schedule .stop-cell-time{font-size:11px;color:#6b7280;margin-top:4px}
.schedule .empty-cell{background:#fafcff}
.schedule .stop-cell.highlight{background:#fff7ed}

/* Stop layout */
.stop-card{padding:16px 18px;background:#fff;cursor:pointer;transition:.15s}
.stop-card:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(37,99,235,.06)}
.stop-card.active-map{outline:2px solid #93c5fd;background:#eff6ff}
.stop-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.stop-title{font-size:17px;font-weight:800}
.stop-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.time-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#dbeafe;color:#1e3a8a;border:1px solid #bfdbfe;font-size:13px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#f8fafc;border:1px solid var(--line);font-size:12px}
.cost-pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:#f8fafc;border:1px solid var(--line);font-size:13px;font-weight:600}
.addr-box{margin-top:12px;background:#f8fafc;border-radius:12px;padding:10px 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:12px;color:#334155;font-weight:600}
.day-header{padding:18px;border-radius:20px;background:linear-gradient(135deg,#eff6ff,#ecfeff);border:1px solid var(--line)}
/* Day 卡片內的行程目錄（點擊跳到對應 stop card） */
.day-outline{margin-top:14px;border-top:1px dashed #bfdbfe;padding-top:12px}
.day-outline-title{font-size:13px;font-weight:700;color:#0f4c81;margin-bottom:8px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;width:100%;background:transparent;border:0;padding:4px 6px;border-radius:8px;text-align:left;font-family:inherit;transition:.12s}
.day-outline-title:hover{background:rgba(255,255,255,.7)}
/* 純 CSS 三角形：展開時朝下（▼），收合時旋轉為朝右（▶）；夠大才看得到方向 */
.day-outline-toggle{display:inline-block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #1e40af;transition:transform .18s;flex-shrink:0;margin-right:2px}
.day-outline.collapsed .day-outline-toggle{transform:rotate(-90deg)}
.day-outline.collapsed .day-outline-list{display:none}
.day-outline.collapsed{padding-bottom:0}
.day-outline.collapsed .day-outline-title{margin-bottom:0}
.day-outline-list{display:flex;flex-direction:column;gap:6px;min-width:0}
/* outline-item：固定寬度由父容器決定；長文字一律換行，不會把整體 layout 撐寬 */
.outline-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid #dbeafe;text-decoration:none;color:inherit;cursor:pointer;transition:.12s;font-size:14px;font-family:inherit;text-align:left;width:100%;max-width:100%;min-width:0;box-sizing:border-box}
.outline-item:hover{background:#fff;border-color:#60a5fa;transform:translateX(2px);box-shadow:0 4px 10px rgba(37,99,235,.08)}
.outline-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#1e40af;color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.outline-time{font-size:12px;color:#1e3a8a;background:#dbeafe;border:1px solid #bfdbfe;padding:2px 8px;border-radius:999px;font-weight:700;flex-shrink:0;white-space:nowrap}
/* 名稱：允許多行；min-width:0 + overflow-wrap:anywhere 才能在 flex container 裡正確換行不撐寬 */
.outline-name{font-weight:700;color:#0f172a;flex:1 1 0;min-width:0;line-height:1.4;white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.outline-name.muted-name{color:#94a3b8;font-weight:600;font-style:italic}
.extra-row{background:#f8fafc;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}

/* Edit form */
.edit-form{display:grid;gap:10px;background:var(--warn-bg);border:1px solid var(--warn);border-radius:16px;padding:16px}
.edit-form .form-row{display:grid;gap:4px}
.edit-form label{font-size:12px;color:var(--muted);font-weight:700}
.edit-form input[type=text],.edit-form input[type=number],.edit-form textarea{padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;width:100%}
.edit-form textarea{resize:vertical;min-height:80px;line-height:1.6}
.edit-form .form-row.inline{flex-direction:row;align-items:center}
.edit-form .form-row.inline label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.edit-form .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
/* tags 編輯框下方的「現有標籤」快選 chip */
.edit-form .tag-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.edit-form .tag-suggest{padding:3px 10px;border-radius:999px;background:#f1f5f9;border:1px solid #cbd5e1;color:#334155;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.edit-form .tag-suggest:hover{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1}

/* Add button */
.add-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:2px dashed #94a3b8;background:transparent;border-radius:14px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px}
.add-btn:hover{color:var(--accent);border-color:var(--accent);background:#eff6ff}

/* Markdown */
.md{line-height:1.7;font-size:14px;color:#1f2937}
.md p{margin:0 0 8px}
.md p:last-child{margin:0}
.md a{color:var(--accent)}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:2px 0}
.md code{background:#eef2f7;padding:1px 6px;border-radius:4px;font-size:.92em}
.md pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;overflow:auto;margin:8px 0}
.md pre code{background:transparent;padding:0;color:inherit}
.md blockquote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--muted);margin:8px 0}
.md h1,.md h2,.md h3{margin:6px 0 6px;font-weight:800}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:15px}
.md hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.md table{border-collapse:collapse;margin:6px 0}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}

/* Budget */
.budget-bar{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}
.budget-bar>div{height:100%;background:linear-gradient(90deg,#0ea5e9,#2563eb);border-radius:999px}
.details-wrap{display:grid;gap:10px;margin-top:10px}
.details-row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#f8fafc;border-radius:12px}
.summary-box{margin-top:14px;padding:14px;border-radius:16px;background:#111827;color:#fff}

.small{font-size:13px}
.muted{color:var(--muted)}
.list{display:grid;gap:12px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

/* MD hint */
.md-hint{font-size:11px;color:var(--muted);margin-top:-4px}

/* Reference 列表 */
.ref-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ref-add input{flex:1;min-width:240px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
.ref-add input.ref-title-input{flex:0 1 260px;min-width:180px}
.ref-hint{margin-top:8px;padding:0 4px;color:var(--muted);font-size:12px;line-height:1.5}
/* 平常瀏覽看不到「加入」區塊跟提示，只有開啟編輯模式才顯示 */
body:not(.edit-mode) .ref-add,
body:not(.edit-mode) .ref-hint{display:none !important}
.ref-source{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px}
.ref-source.manual{background:#dcfce7;color:#166534}
.ref-source.auto{background:#dbeafe;color:#1e40af}
.ref-title{font-weight:800;font-size:15px;line-height:1.4}
.ref-title a{color:var(--text);text-decoration:none}
.ref-title a:hover{color:var(--accent);text-decoration:underline}
.ref-url{color:var(--muted);font-size:12px;word-break:break-all;margin-top:4px;display:none}
body.edit-mode .ref-url{display:block}
.ref-loading{color:var(--muted);font-style:italic}
.ref-card{cursor:pointer}
.ref-card:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(37,99,235,.1);border-color:#93c5fd}
.ref-card:hover .ref-title a{color:var(--accent);text-decoration:underline}

/* Favorites (Google Maps 收藏夾) - 內嵌在地圖資訊 sub-tab */
.fav-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.fav-toolbar input{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:#fff}
.fav-info{font-size:12px;color:var(--muted);margin:4px 2px 10px;line-height:1.6}
.fav-place{border:1px solid var(--line);background:#fafcff;border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
.fav-place:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(37,99,235,.06);border-color:#93c5fd}
.fav-place.active{outline:2px solid #2563eb;background:#eff6ff}
.fav-place-idx{display:inline-block;width:22px;height:22px;background:#2563eb;color:#fff;border-radius:50%;font-weight:800;font-size:12px;text-align:center;line-height:22px;margin-right:8px;vertical-align:middle}
.fav-place-name{font-weight:800;font-size:14px;color:var(--text)}
.fav-place-addr{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
.fav-place-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ============== 手機版（max-width:640px）====================================== */

  .in-drawer .drop-sub{color:#6b7280}

  /* panel-map：地圖滿版 + 底部 sheet（hidden 時仍要消失，所以加 :not([hidden])） */

  /* z-index 必須 > Leaflet 內部的 .leaflet-control-container（預設 1000），否則 leaflet 控制元件會蓋住 sheet */

  .item-card{padding:12px}
  .stop-card{padding:12px 14px}
  .stop-title{font-size:15px}
}

<script>
// ============== 全域狀態與常數 ==============
const STORAGE_KEY = 'travel-notes-data-v1';
const DRIVE_KEY   = 'travel-notes-drive-v1';
const TOKEN_KEY   = 'travel-notes-drive-token-v1';
const HERO_COLLAPSED_KEY = 'travel-notes-hero-collapsed-v1';

// ============== Google Drive 設定 ==============
// 使用前請到 https://console.cloud.google.com/ 申請 OAuth Client ID 與 API Key
// 然後填入下面兩個欄位即可。詳細步驟見 README。
const GOOGLE_CONFIG = {
  CLIENT_ID: '',  // 例: '1234567890-abcdefg.apps.googleusercontent.com'
  SCOPES:    'https://www.googleapis.com/auth/drive.file',
  DISCOVERY_DOC: 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'
};
// 從 CLIENT_ID 取出專案編號，給 Picker 的 setAppId 使用（drive.file scope 必填）
const GOOGLE_APP_ID = (GOOGLE_CONFIG.CLIENT_ID.match(/^(\d+)-/) || [])[1] || '';

const driveState = {
  gapiInited: false,
  gisInited:  false,
  tokenClient: null,
  accessToken: null,
  fileId:   null,
  fileName: null,
  userEmail: null,
  saving: false,
  dirty:  false,
  saveTimer: null
};

const state = {
  data: null,
  activeMain: 'map',
  activeMapSub: 'days',
  activeDay: '',
  activeStay: '',
  activeShop: '',
  activeBudget: '__total__',
  activeTag: '__all__',
  currentMapId: '',
  activeStopId: '',
  currentLocations: [],
  editing: null,
  editMode: false,
  heroCollapsed: true,
  mapMode: 'single',  // 'single' | 'allDay'
  allDayKey: ''
};

// 各種 icon (避免相依外部)
const ICONS = {
  edit: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 17.46V21h3.54l10.4-10.4-3.54-3.54L3 17.46zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>'
};

// ============== 小工具 ==============
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function escapeHtml(v){return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function nonEmpty(v){return v !== undefined && v !== null && String(v).trim() !== '';}
function money(v){return new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(v||0));}
function uid(){return 'u' + Math.random().toString(36).slice(2,9);}
function setStatus(t){ const el = $('#loadStatus'); if(el) el.textContent = t; }

// markdown 渲染（含 sanitize fallback）
// 所有 <a> 都加上 target="_blank" rel="noopener noreferrer"，避免在當前分頁跳走
function renderMd(text){
  if(!nonEmpty(text)) return '';
  let html = '';
  if(typeof marked !== 'undefined'){
    try{
      html = marked.parse(String(text), {breaks:true, gfm:true});
      if(typeof DOMPurify !== 'undefined') html = DOMPurify.sanitize(html);
    }catch(e){
      html = escapeHtml(text).replace(/\n/g,'<br>');
    }
  } else {
    html = escapeHtml(text).replace(/\n/g,'<br>');
  }
  return forceLinksNewTab(html);
}

// 為 HTML 內所有 <a> 加上 target="_blank" 與 rel="noopener noreferrer"
function forceLinksNewTab(html){
  return String(html).replace(/<a\b([^>]*)>/gi, (m, attrs) => {
    let a = attrs;
    if(/\btarget\s*=/.test(a)){
      a = a.replace(/\btarget\s*=\s*("[^"]*"|'[^']*'|\S+)/i, 'target="_blank"');
    } else {
      a += ' target="_blank"';
    }
    if(/\brel\s*=/.test(a)){
      a = a.replace(/\brel\s*=\s*("([^"]*)"|'([^']*)'|(\S+))/i, (mm, _q, dq, sq, bare) => {
        const cur = (dq || sq || bare || '').toLowerCase();
        const need = ['noopener','noreferrer'].filter(k => !cur.includes(k));
        const merged = (cur + (need.length ? ' ' + need.join(' ') : '')).trim();
        return `rel="${merged}"`;
      });
    } else {
      a += ' rel="noopener noreferrer"';
    }
    return `<a${a}>`;
  });
}

function embedUrl(url){
  try{
    const u = new URL(url);
    const q = u.searchParams.get('q') || u.searchParams.get('query') || url;
    return 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed';
  }catch{
    return 'https://www.google.com/maps?q=' + encodeURIComponent(url || '台灣') + '&output=embed';
  }
}

// 取得項目可用的地圖目標 URL（決定 iframe 載入什麼）
// 需要重建 URL 的兩種情況：
//   A. 純座標 URL (?q=lat,lng)：只會顯示一個紅釘，沒有 Place 面板
//   B. Google 評論型「垃圾搜尋 URL」(/maps/search/店名,+Visited+...+beautiful.../@lat,lng)
//      使用者從 Google Maps 點「分享」時會得到這種個性化 URL，店名後面跟著一大段評論文字，
//      iframe 載入後只會顯示「搜尋結果頁」而不是乾淨的 Place 面板
// 解法：用已抓到的 maps_label + address 組合乾淨的「店名,地址」URL，Google Maps 會自動展開 Place 面板
function getMap(item){
  if(!item) return '';
  if(!nonEmpty(item.map) || !/^https?:\/\//i.test(item.map)) return '';

  const coordsOnly = /\?q=-?\d{1,3}\.\d+,-?\d{1,3}\.\d+(?:\s*$|&(?:output=embed)?\s*$)/.test(item.map);
  let junkSearch = false;
  if(!coordsOnly){
    try {
      const u = new URL(item.map);
      if(/google\.[a-z.]+/i.test(u.hostname) && /\/maps\/search\//i.test(u.pathname)){
        const m = u.pathname.match(/\/maps\/search\/([^/]+)/);
        if(m){
          const query = decodeURIComponent(m[1]);
          // 查詢文字超過 60 字，或包含評論常見語氣詞 → 視為垃圾評論型 URL
          if(query.length > 60 || /(?:visited|beautiful|amazing|recommend|stunning|highly|definitely|would|packed\s+with|worth|deserve|must\s+(?:visit|go|see))/i.test(query)){
            junkSearch = true;
          }
        }
      }
    } catch {}
  }

  if((coordsOnly || junkSearch) && nonEmpty(item.maps_label)){
    const label = String(item.maps_label).trim();
    const addr = nonEmpty(item.address) ? ', ' + String(item.address).trim() : '';
    return `https://maps.google.com/?q=${encodeURIComponent(label + addr)}`;
  }
  // 還沒 meta 但確定是垃圾 URL → 至少退回純座標版（好過載入評論搜尋頁）
  if(junkSearch){
    const ll = extractLatLngFromGoogleUrl(item.map);
    if(ll) return `https://maps.google.com/?q=${ll.lat},${ll.lng}`;
  }
  return item.map;
}

}

async function handleDriveSignIn(){
  if(!GOOGLE_CONFIG.CLIENT_ID || !GOOGLE_CONFIG.API_KEY){
    alert('請先在 index.html 的 GOOGLE_CONFIG 填入 CLIENT_ID 與 API_KEY。\n申請步驟見 README。');
    return;
  }
  if(!driveState.gapiInited || !driveState.gisInited){
    alert('Google API 還在載入中，請稍後再試（檢查網路）');
    return;
  }
  driveState.tokenClient.callback = async (resp) => {
    if(resp.error){ setDriveStatus('登入失敗：' + resp.error); return; }
    driveState.accessToken = resp.access_token;
    let email = '';
    // 取得使用者 email 顯示用（drive.file scope 通常拿不到，失敗就忽略）
    try{
      const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
        headers: { Authorization: 'Bearer ' + resp.access_token }
      });
      if(r.ok){ const u = await r.json(); driveState.userEmail = u.email; email = u.email; }
    }catch(e){}
    // 把 token 存到 localStorage，下次重新整理頁面就不用再登入
    saveTokenToStorage(resp.access_token, resp.expires_in, email);
    try{ gapi.client.setToken({ access_token: resp.access_token }); }catch(e){}
    if(driveState.fileId){
      await loadFromDriveById(driveState.fileId);
    }
    updateDriveUI();
  };
  // prompt: '' 表示若使用者之前已同意 scope，直接 silent 取得 token，不再彈同意畫面
  driveState.tokenClient.requestAccessToken({ prompt: '' });
}

function handleDriveSignOut(){
  if(driveState.accessToken){
    try{ google.accounts.oauth2.revoke(driveState.accessToken, () => {}); }catch(e){}
  }
  driveState.accessToken = null;
  driveState.userEmail = null;
  clearTokenStorage();
  try{ gapi.client.setToken(null); }catch(e){}

  updateDriveUI();
}

// 從 Google Drive 共用連結中抽出檔案 ID
// 支援格式：
//   https://drive.google.com/file/d/FILE_ID/view?usp=sharing
//   https://drive.google.com/open?id=FILE_ID
//   https://docs.google.com/document/d/FILE_ID/edit
//   直接貼 FILE_ID
function parseDriveFileId(input){
  if(!input) return null;
  const s = String(input).trim();
  if(!s) return null;
  let m = s.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = s.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = s.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{20,}$/.test(s)) return s;
  return null;
}

  if(input === null) return;

async function loadFromDriveById(fileId, name){
  if(!driveState.accessToken) return;
  try{
    setDriveStatus('讀取 Drive 檔案中…');
    // 先取 metadata 拿名稱
    let fileName = name;
    if(!fileName){
      const meta = await gapi.client.drive.files.get({ fileId, fields: 'name' });
      fileName = meta.result.name;
    }
    // 取內容
    const res = await gapi.client.drive.files.get({ fileId, alt: 'media' });
    let parsed;
    try{ parsed = typeof res.body === 'string' ? JSON.parse(res.body) : res.result; }
    catch(e){ throw new Error('檔案內容不是有效的 JSON'); }
    driveState.fileId = fileId;
    driveState.fileName = fileName;
    driveState.dirty = false;
    saveDriveSettings();
    // 直接寫入畫面（避開 saveData 觸發自動儲存的循環）
    state.data = parsed;
    state.activeDay = parsed.days?.[0]?.key || '';
    state.activeStay = parsed.stay_groups?.[0]?.key || '';
    state.activeShop = parsed.shop_groups?.[0]?.key || '';
    state.editing = null;
    state.currentMapId = '';
    // [暫時關閉] 不快取到 localStorage，重整時會重新從 Drive / 預設 trip.json 載入
    // try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){}
    renderAll();
    setTimeout(() => tryResolveShortMaps(), 200);
    setStatus('已從 Google Drive 載入：' + fileName);
    updateDriveUI();
  }catch(err){
    console.error(err);
    const msg = err.result?.error?.message || err.message || '未知';
    const status = err.status || err.result?.error?.code;
    setDriveStatus('讀取失敗：' + msg);
    if(status === 401){
      handleDriveSignOut();
      return;
    }
    // 404 / 找不到檔案 → 舊 fileId 已失效或本 App 無權存取，清掉設定避免一直自動失敗
    if(status === 404 || /not found|找不到/i.test(msg)){
      driveState.fileId = null;
      driveState.fileName = null;
      saveDriveSettings();
      updateDriveUI();
      setDriveStatus('找不到該檔案。可能原因：（1）檔案已被刪除或移動 （2）這個檔案沒有授權給此 App（drive.file 權限只能讀「曾用此 App 開啟過」的檔案，請改用「選現有檔案」用 Picker 選一次）');
    }
  }
}

async function createNewDriveFile(){
  if(!driveState.accessToken){ alert('請先登入'); return; }
  if(!state.data){ alert('沒有資料可儲存'); return; }
  const name = prompt('請輸入要建立的檔案名稱（會放在 Google Drive 我的雲端硬碟根目錄）', 'trip.json');
  if(!name) return;
  try{
    setDriveStatus('建立 Drive 檔案中…');
    const metadata = { name, mimeType: 'application/json' };
    const content = JSON.stringify(state.data, null, 2);
    const boundary = '-------drive-boundary-' + Date.now();
    const delim = '\r\n--' + boundary + '\r\n';
    const closeDelim = '\r\n--' + boundary + '--';
    const body =
      delim + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata) +
      delim + 'Content-Type: application/json\r\n\r\n' + content +
      closeDelim;
    const res = await gapi.client.request({
      path: '/upload/drive/v3/files',
      method: 'POST',
      params: { uploadType: 'multipart' },
      headers: { 'Content-Type': 'multipart/related; boundary="' + boundary + '"' },
      body
    });
    driveState.fileId = res.result.id;
    driveState.fileName = res.result.name;
    driveState.dirty = false;
    saveDriveSettings();
    updateDriveUI();
    alert('已在你的 Google Drive 建立「' + driveState.fileName + '」\n之後其他旅伴可以用「選現有檔案」載入此檔案（你需要先在 Drive 將檔案分享給他們）。');
  }catch(err){
    console.error(err);
    setDriveStatus('建立失敗：' + (err.result?.error?.message || err.message || '未知'));
  }
}

async function saveToDrive(){
  if(!driveState.accessToken || !driveState.fileId) return;
  if(!state.data) return;
  if(driveState.saving) return;
  driveState.saving = true;
  try{
    setDriveStatus('儲存中…');
    const content = JSON.stringify(state.data, null, 2);
    await gapi.client.request({
      path: '/upload/drive/v3/files/' + driveState.fileId,
      method: 'PATCH',
      params: { uploadType: 'media' },
      headers: { 'Content-Type': 'application/json' },
      body: content
    });
    driveState.dirty = false;
    updateDriveUI();
    setDriveStatus('✓ 已同步到 ' + driveState.fileName + '（' + new Date().toLocaleTimeString() + '）');
  }catch(err){
    console.error(err);
    setDriveStatus('儲存失敗：' + (err.result?.error?.message || err.message || '未知'));
    if(err.status === 401){ handleDriveSignOut(); }
  }finally{
    driveState.saving = false;
  }
}

// 舊資料相容：把 stop.type 併入 stop.tags，之後統一只用 tags
function normalizeStopTags(){
  (state.data?.days||[]).forEach(day => (day.stops||[]).forEach(stop => {
    const tags = Array.isArray(stop.tags) ? stop.tags.map(t => String(t).trim()).filter(Boolean) : [];
    if(nonEmpty(stop.type)) tags.push(String(stop.type).trim());
    stop.tags = [...new Set(tags)];
    delete stop.type;
  }));
}

// 對 state.data 做修改 + 自動 save + re-render
// 若這次 mutate 結束了一個編輯（state.editing 變 null），自動把畫面滾回去剛編輯的卡片
function mutate(fn){
  const wasEditing = state.editing;
  fn(state.data);
  saveData();
  renderAll();
  if(wasEditing && !state.editing){
    requestAnimationFrame(() => {
      // 從 mapSubContent / 各 panel 找對應 card
      const target = document.querySelector(`[data-edit-id="${cssEscape(wasEditing)}"]`);
      if(target){
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.add('flash');
        setTimeout(() => target.classList.remove('flash'), 1200);
      }
    });
  }
  // 背景解析新貼上的短網址
  setTimeout(() => tryResolveShortMaps(), 200);
}

// CSS.escape polyfill (簡化)
function cssEscape(str){
  if(typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(str);
  return String(str).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c);
}

// ============== 地圖位置匯整與聚焦 ==============
function buildLocations(){
  const data = state.data;
  if(!data) return [];
  const locs = [];
  let seq = 0;
  (data.days||[]).forEach((day, di)=>(day.stops||[]).forEach((stop, si)=>{
    const m = getMap(stop);
    const ll = extractLatLng(stop);
    if(!m) return;
    const tagText = Array.isArray(stop.tags) ? stop.tags.map(t => String(t).trim()).filter(Boolean).join('、') : '';
    locs.push({id:`day-${day.key||di}-${si}`, stopid:`${day.key||di}:${si}`, map:m,
      source:`每日行程 / ${day.label||'Day '+(di+1)}`,
      title:stop.maps_label || stop.name || '地點',
      subtitle:[tagText, stop.time, stop.cost].filter(Boolean).join('｜'),
      address:stop.short_address || stop.address || '',
      fullAddress:stop.address || '', lat:ll?.lat, lng:ll?.lng, order:seq++});
  }));
  (data.stay_groups||[]).forEach((g, gi)=>(g.items||[]).forEach((it, ii)=>{
    const m = getMap(it);
    const ll = extractLatLng(it);
    if(!m) return;
    locs.push({id:`stay-${g.key||gi}-${ii}`, map:m,
      source:`住宿 / ${g.label||'住宿'}`,
      title:it.name||'住宿',
      subtitle:it.note||it.reference||'',
      address:it.address||it.area||'',
      fullAddress:it.address||'', lat:ll?.lat, lng:ll?.lng, order:seq++});
  }));
  (data.shop_groups||[]).forEach((g, gi)=>(g.items||[]).forEach((it, ii)=>{
    const m = getMap(it);
    const ll = extractLatLng(it);
    if(!m) return;
    locs.push({id:`shop-${g.key||gi}-${ii}`, map:m,
      source:`資訊分類 / ${g.label||'分類'}`,
      title:it.name||'店家',
      subtitle:[it.tag, it.price].filter(Boolean).join('｜'),
      address:it.address||'',
      fullAddress:it.address||'', lat:ll?.lat, lng:ll?.lng, order:seq++});
  }));
  return locs;
}

// 為單一地點挑選最佳的 iframe URL。
// 核心觀察：Google 解析後的 URL 路徑 /maps/place/<官方店名>/@lat,lng/... 中的 <官方店名>
// 是 Google 自己當作 unique key 的那個名字（會包含分店資訊，如「京的燒肉處 弘 京都站前店」）。
// 用這個名字當 ?q= 查詢一定能 unique 命中那個地點，iframe 顯示左上 Place 面板，
// 點「在 Google Maps 開啟」也會直達該地點，不會跳搜尋頁。
// 退而求其次：
//   1. 有 lat/lng → 用 q=lat,lng (顯示名) 釘單點
//   2. 否則退回舊 embedUrl
function buildSingleEmbedSrc(loc){
  const officialName = extractPlaceNameFromGoogleUrl(loc.map);
  if(officialName){
    return `https://www.google.com/maps?q=${encodeURIComponent(officialName)}&output=embed`;
  }
  // 沒有官方 place name → 走 embedUrl(loc.map)，行為與舊版一致
  // 不再硬加 "(顯示名)"，避免 lat,lng 與顯示名不一致時被當搜尋字串
  return embedUrl(loc.map || '');
}

// 從 Google Maps 解析後的長 URL 抽出 /maps/place/<官方店名>/ 那段店名（已 URL-decode、+ 轉空白）
function extractPlaceNameFromGoogleUrl(url){
  if(!nonEmpty(url)) return '';
  try {
    const u = new URL(url);
    const isGoogle = /google\.[a-z.]+/i.test(u.hostname) || u.hostname === 'maps.google.com';
    if(!isGoogle) return '';
    const m = u.pathname.match(/\/maps\/place\/([^/]+)/i);
    if(!m) return '';
    let name = decodeURIComponent(m[1]).replace(/\+/g, ' ').trim();
    // 純座標路徑（例如 /maps/place/34.988,135.758）就不是真正的地點名
    if(/^-?\d{1,3}\.\d+,\s*-?\d{1,3}\.\d+$/.test(name)) return '';
    return name;
  } catch {
    return '';
  }
}

// 從 stop 取出 lat/lng
// 優先順序：item.lat/lng 分離欄位 > item.map URL 裡內嵌的座標
// 這樣即使 map URL 是「店名+地址」形式（iframe 顯示完整 Place 面板），仍可拿到座標給 Leaflet 多點地圖用
function extractLatLng(stop){
  if(!stop) return null;
  if(typeof stop.lat === 'number' && typeof stop.lng === 'number' &&
     Math.abs(stop.lat) <= 90 && Math.abs(stop.lng) <= 180){
    return { lat: stop.lat, lng: stop.lng };
  }
  const point = extractMapPoint(stop);
  if(!point) return null;
  const m = String(point).match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if(!m) return null;
  const lat = parseFloat(m[1]);
  const lng = parseFloat(m[2]);
  if(isNaN(lat) || isNaN(lng)) return null;
  return { lat, lng };
}

// ============== Leaflet 多點地圖 ==============
let leafletMap = null;
let leafletLayer = null;
let currentTileLayer = null;
let currentTileIdx = 0;

// 多個免費 tile providers，依序 fallback
const TILE_PROVIDERS = [
  {
    name: 'CartoDB Voyager',
    url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    options: {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }
  },
  {
    name: 'Esri World Street Map',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    options: {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 19
    }
  },
  {
    name: 'CartoDB Light',
    url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    options: {
      attribution: '&copy; OSM &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }
  },
  {
    name: 'OpenStreetMap',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    options: {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }
  }
];

function applyTileProvider(idx){
  if(!leafletMap || idx >= TILE_PROVIDERS.length) return;
  if(currentTileLayer){
    leafletMap.removeLayer(currentTileLayer);
    currentTileLayer = null;
  }
  const provider = TILE_PROVIDERS[idx];
  const layer = L.tileLayer(provider.url, provider.options);
  let errorCount = 0;
  let switched = false;
  layer.on('tileerror', () => {
    errorCount++;
    if(!switched && errorCount >= 4 && idx + 1 < TILE_PROVIDERS.length){
      switched = true;
      console.warn(`[Map] tile provider "${provider.name}" failed, switching to "${TILE_PROVIDERS[idx+1].name}"`);
      applyTileProvider(idx + 1);
    }
  });
  layer.addTo(leafletMap);
  currentTileLayer = layer;
  currentTileIdx = idx;
}

function ensureLeafletInit(){
  if(leafletMap) return leafletMap;
  if(typeof L === 'undefined') return null;
  const el = document.getElementById('leafletMap');
  if(!el) return null;
  leafletMap = L.map(el, { zoomControl: true, scrollWheelZoom: true }).setView([35.0, 135.5], 9);
  applyTileProvider(0);
  leafletLayer = L.layerGroup().addTo(leafletMap);
  return leafletMap;
}

function setMapMode(mode){
  const canvas = $('#mapCanvas');
  if(canvas) canvas.dataset.mode = mode;
  if(mode === 'leaflet'){
    setTimeout(() => leafletMap && leafletMap.invalidateSize(), 60);
  }
}

// num 是顯示在 marker 上的編號（不一定連續：跳過沒座標的 stop 後仍對應原始本日行程編號）
// isFirst / isLast 控制顏色（綠=起點、紫=終點）
function makeNumberedMarker(num, isFirst, isLast){
  const cls = isFirst ? ' first' : (isLast ? ' last' : '');
  return L.divIcon({
    className: 'leaflet-div-icon',
    html: `<div class="num-marker${cls}"><span>${num}</span></div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -30]
  });
}

// 全日路線模式下：每個 stop 對應的 Leaflet marker，
// key = `${day.key}:${原始 idx}`（與 stop card dataset.stopid 一致），讓 hover/點擊卡片時可以反查出 marker
let allDayStopMarkers = new Map();

// 對外 helper：在「全日路線」啟用時，把指定 stop 的 marker popup 打開（並可選擇是否平移地圖）
// dayKey 與 stopIdx 是該 stop 在 state.data 中的位置
function openAllDayStopPopup(dayKey, stopIdx, opts){
  if(!leafletMap) return;
  if(!(state.mapMode === 'allDay' && state.allDayKey === dayKey)) return;
  const marker = allDayStopMarkers.get(`${dayKey}:${stopIdx}`);
  if(!marker) return;
  // 已開狀態下重複 open 會閃爍；用 isPopupOpen 防呆
  if(!marker.isPopupOpen || !marker.isPopupOpen()) marker.openPopup();
  if(opts && opts.pan){
    try { leafletMap.panTo(marker.getLatLng(), { animate: true, duration: 0.4 }); } catch {}
  }
}

// 在 Leaflet 地圖上顯示一組 stops (含順序連線)
// 回傳 { ok, count } -- ok 表示是否成功用 Leaflet 顯示
function showStopsOnLeaflet(stops, day){
  const map = ensureLeafletInit();
  if(!map) return { ok: false, count: 0 };

  setMapMode('leaflet');
  if(leafletLayer) leafletLayer.clearLayers();
  allDayStopMarkers.clear();

  const validStops = stops.map((s, idx) => ({ stop: s, idx, ll: extractLatLng(s) })).filter(x => x.ll);
  if(!validStops.length) return { ok: true, count: 0 };

  const dayKey = (day && day.key) || '';
  const points = [];
  validStops.forEach((v, i) => {
    const { stop, idx, ll } = v;
    // 編號用原始 stop 在 day.stops 的 index + 1，這樣跳過沒座標的 stop 之後
    // 地圖上的編號仍然對應「本日行程」清單裡的編號（不會重新從 1 算）
    const num = idx + 1;
    const isFirst = i === 0;
    const isLast = i === validStops.length - 1;
    const marker = L.marker([ll.lat, ll.lng], { icon: makeNumberedMarker(num, isFirst, isLast) });
    const mapsLink = nonEmpty(stop.map) ? stop.map : `https://www.google.com/maps?q=${ll.lat},${ll.lng}`;
    marker.bindPopup(`
      <div class="pop-title">${num}. ${escapeHtml(stop.name||'(未命名)')}</div>
      ${nonEmpty(stop.time) ? `<div class="pop-meta">⏰ ${escapeHtml(stop.time)}</div>` : ''}
      ${Array.isArray(stop.tags) && stop.tags.length ? `<div class="pop-meta">🏷 ${escapeHtml(stop.tags.join(' / '))}</div>` : ''}
      ${nonEmpty(stop.address) ? `<div class="pop-meta" style="margin-top:4px">📍 ${escapeHtml(stop.address)}</div>` : ''}
      <div style="margin-top:6px"><a href="${escapeHtml(mapsLink)}" target="_blank" rel="noopener noreferrer">在 Google Maps 開啟</a></div>
    `);
    marker.addTo(leafletLayer);
    points.push([ll.lat, ll.lng]);
    if(dayKey) allDayStopMarkers.set(`${dayKey}:${idx}`, marker);
  });

  // 順序連線 (虛線)
  if(points.length >= 2){
    L.polyline(points, { color:'#2563eb', weight:3, opacity:.75, dashArray:'6,8' }).addTo(leafletLayer);
  }

  if(points.length === 1) map.setView(points[0], 14);
  else map.fitBounds(L.latLngBounds(points), { padding: [40, 40], maxZoom: 15 });

  return { ok: true, count: validStops.length };
}

// 切回 Google Maps iframe
function useGoogleIframe(){
  setMapMode('iframe');
}

// 把 "09:30" 這類時間字串轉成「當日分鐘數」；支援全型冒號、前後空白；空字串/無效時回 null
// 空字串回 null 是為了讓排序時能把「未設時間」的 stop 固定排在最後
function parseTimeMin(t){
  if(!t || typeof t !== 'string') return null;
  const m = t.trim().match(/^(\d{1,2})\s*[:：]\s*(\d{1,2})/);
  if(!m) return null;
  const h = parseInt(m[1], 10);
  const mi = parseInt(m[2], 10);
  if(isNaN(h) || isNaN(mi)) return null;
  return h * 60 + mi;
}

// 把一天的 stops 按 time 重新排序：
// - 有時間的按升冪（09:00 在 14:00 之前）
// - 沒時間的保持原順序，全部排在最後
// - 相同時間者維持原本順序（穩定排序）
// 用途：使用者新增/編輯 stop 並填入時間後，讓它自動插到對的位置
function sortStopsByTime(stops){
  if(!Array.isArray(stops) || stops.length < 2) return stops;
  const indexed = stops.map((s, i) => ({ s, i }));
  indexed.sort((a, b) => {
    const ta = parseTimeMin(a.s?.time);
    const tb = parseTimeMin(b.s?.time);
    if(ta == null && tb == null) return a.i - b.i;
    if(ta == null) return 1;
    if(tb == null) return -1;
    if(ta !== tb) return ta - tb;
    return a.i - b.i;
  });
  return indexed.map(x => x.s);
}

// 從 stop 取得地圖座標或地址 (給多點地圖用)
// 嚴格只認 stop.map 欄位，避免假 address (如「訂單編號 xxx」「A→B」) 被當成地圖點
function extractMapPoint(stop){
  if(!stop) return '';
  // 優先用分離座標欄位（最精準）
  if(typeof stop.lat === 'number' && typeof stop.lng === 'number'){
    return `${stop.lat},${stop.lng}`;
  }
  if(!nonEmpty(stop.map) || !/^https?:\/\//i.test(stop.map)) return '';
  try {
    const u = new URL(stop.map);
    const q = u.searchParams.get('q') || u.searchParams.get('query');
    if(q) return q;
  } catch {}
  const m = String(stop.map).match(/[?&](?:q|query)=([^&]+)/);
  if(m) return decodeURIComponent(m[1]);
  // 支援 /maps/search/XXX/@lat,lng 或 /maps/place/XXX/@lat,lng 這類 path 內座標
  const at = String(stop.map).match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
  if(at) return `${at[1]},${at[2]}`;
  return '';
}

// 將多個 stops 串成 Google Maps 路線 embed URL (saddr + daddr+to:...)
function buildMultiPointEmbedUrl(stops){
  const points = stops.map(extractMapPoint).filter(Boolean);
  if(points.length === 0) return null;
  if(points.length === 1) return embedUrl('https://maps.google.com/?q=' + encodeURIComponent(points[0]));
  const saddr = encodeURIComponent(points[0]);
  const daddrParts = points.slice(1).map(p => encodeURIComponent(p));
  const daddr = daddrParts.join('+to:');
  return `https://maps.google.com/maps?saddr=${saddr}&daddr=${daddr}&output=embed`;
}

// 在地圖區一次顯示某天全部 stops 的路線
function showAllStopsOnMap(day){
  const allStops = (day.stops||[]).filter(s => extractMapPoint(s));
  const focus = $('#mapFocus');

  // 優先用 Leaflet 顯示多 marker
  // 傳整個 day.stops（非過濾後）給 showStopsOnLeaflet，讓裡面用原始 idx 編號，
  // 才能跟「本日行程」清單編號對應上（沒座標的 stop 編號會被跳過）
  const result = showStopsOnLeaflet(day.stops || [], day);
  let extraNote = '';
  if(!result.ok){
    // Leaflet 載入失敗 → fallback 到 Google Maps directions iframe
    useGoogleIframe();
    const frame = $('#mapFrame');
    if(allStops.length){
      const url = buildMultiPointEmbedUrl(allStops);
      if(url) frame.src = url;
    } else {
      frame.src = embedUrl('台灣');
    }
    extraNote = '<div class="muted small" style="margin-top:6px">（地圖元件未載入，已退回 Google Maps 路線模式）</div>';
  }

  if(!allStops.length){
    focus.innerHTML = `
      <div class="muted">${escapeHtml(day.label||'')} 當日無可顯示的地圖位置</div>
      <div class="actions" style="margin-top:8px"><button type="button" class="btn secondary" id="backToSingleBtn">← 回到單一地點</button></div>
    `;
  } else {
    const withCoords = result.ok ? result.count : allStops.length;
    const skipped = allStops.length - withCoords;
    focus.innerHTML = `
      <div class="small muted">${escapeHtml(day.label||'')} · 全日地點 (${withCoords})${skipped>0?` <span style="color:#dc2626">·略過 ${skipped} 個無座標</span>`:''}</div>
      <h3 style="margin:6px 0">${escapeHtml(day.title||'')}</h3>
      <ol style="margin:8px 0 0;padding-left:22px;line-height:1.7">
        ${allStops.map((s, i) => `<li>${escapeHtml(s.name||'')}${nonEmpty(s.time)?` <span class="muted small">${escapeHtml(s.time)}</span>`:''}</li>`).join('')}
      </ol>
      ${extraNote}
      <div class="actions" style="margin-top:10px">
        <a class="btn secondary" href="https://www.google.com/maps/dir/${allStops.map(s => encodeURIComponent(extractMapPoint(s))).join('/')}" target="_blank" rel="noopener noreferrer">在 Google Maps 開啟完整路線</a>
        <button type="button" class="btn secondary" id="backToSingleBtn">← 回到單一地點</button>
      </div>
    `;
  }
  state.currentMapId = '';
  highlightActiveMap();
  $('#backToSingleBtn')?.addEventListener('click', () => {
    state.mapMode = 'single';
    state.allDayKey = '';
    applyMapView();
  });
}

// 根據 state.mapMode / activeMapSub 套用地圖顯示
function applyMapView(){
  // 依照當前 sub tab 切換地圖容器尺寸（收藏夾用大地圖，其餘用預設 420px）
  const canvas = $('#mapCanvas');
  if(canvas) canvas.classList.toggle('fav-canvas', state.activeMapSub === 'favorites');

  // 收藏夾 sub tab：地圖顯示所有收藏地點
  if(state.activeMapSub === 'favorites'){
    showFavoritesOnMainMap();
    return;
  }
  if(state.mapMode === 'allDay' && state.allDayKey){
    const day = (state.data.days||[]).find(d => d.key === state.allDayKey);
    if(day){ showAllStopsOnMap(day); return; }
  }
  if(state.currentLocations.length){
    const target = state.currentLocations.find(l => l.id === state.currentMapId) || state.currentLocations[0];
    focusMap(target.id);
  } else {
    $('#mapFrame').src = embedUrl('台灣');
    $('#mapFocus').innerHTML = '<div class="muted">尚無有地圖位置的項目</div>';
  }
}

function highlightActiveMap(){
  // stay/shop 卡片用 currentMapId
  $$('[data-mapid]').forEach(el => {
    if(el.classList.contains('stop-card')) return; // stop card 用下方邏輯
    el.classList.toggle('active-map', el.dataset.mapid === state.currentMapId);
  });
  // stop 卡片（不論有沒有 map）用 activeStopId 判斷
  $$('.stop-card[data-stopid]').forEach(el => {
    el.classList.toggle('active-map', el.dataset.stopid === state.activeStopId);
  });
}

// 跳到指定 stop：切到地圖 tab、切換 day、focus 地圖（若有座標）、卷動到該卡片
function jumpToStop(dayKey, stopIdx){
  if(!dayKey || stopIdx < 0) return;
  const day = (state.data.days||[]).find(d => d.key === dayKey);
  if(!day) return;
  const stop = (day.stops||[])[stopIdx];
  if(!stop) return;

  state.activeMain = 'map';
  state.activeMapSub = 'days';
  state.activeDay = dayKey;
  state.activeStopId = `${dayKey}:${stopIdx}`;

  // 只有當該 stop 真的有地圖位置時才切換地圖；否則保留原本顯示
  const hasMap = !!getMap(stop);
  if(hasMap){
    state.currentMapId = `day-${dayKey}-${stopIdx}`;
    state.mapMode = 'single';
  }

  renderAll();
  // 等下一個 tick scroll，因為 DOM 剛重建
  requestAnimationFrame(() => {
    const target = [...document.querySelectorAll('#mapSubContent [data-stopid]')]
      .find(el => el.dataset.stopid === `${dayKey}:${stopIdx}`);
    if(target){
      target.scrollIntoView({behavior:'smooth', block:'center'});
      target.classList.add('active-map');
    }
  });
}

// ============== 停留時間自動計算 ==============
// 從 stop.time 字串（例 "18:30-19:00"）自動算出停留時間，回傳像「30 分」「1 小時 30 分」
// 使用者只要填時間區間，不需另外填停留時間欄位
function computeStayDuration(timeStr){
  const h = parseHours(timeStr);
  if(!h) return '';
  let startMin = h.startH * 60 + h.startM;
  let endMin = h.endH * 60 + h.endM;
  if(endMin < startMin) endMin += 24 * 60; // 跨夜
  const diff = endMin - startMin;
  if(diff <= 0) return '';
  const hours = Math.floor(diff / 60);
  const mins = diff % 60;
  if(hours > 0 && mins > 0) return `${hours} 小時 ${mins} 分`;
  if(hours > 0) return `${hours} 小時`;
  return `${mins} 分`;
}

// ============== 收集 stop 出現過的所有標籤（給 tags 下拉選單用） ==============
function collectStopTags(){
  const set = new Set();
  (state.data?.days||[]).forEach(d => (d.stops||[]).forEach(s => {
    if(Array.isArray(s.tags)) s.tags.forEach(t => { if(nonEmpty(t)) set.add(String(t).trim()); });
  }));
  return Array.from(set).sort();
}

  ],
  budgetItem: [
    {key:'label', label:'類別'},
    {key:'value', label:'金額（NT$）', type:'number'}
  ],
  budgetDetail: [

    {key:'amount', label:'金額（NT$）', type:'number'},
    {key:'note', label:'備註'}
  ]
};

// ============== 通用編輯表單 ==============
// 取選項 helper：支援 options 為陣列或函式（函式用於需要動態收集現有資料當選項時）
function _resolveOptions(f){
  if(typeof f.options === 'function') return f.options() || [];
  return f.options || [];
}

function buildEditForm(fields, values, onSave){
  const wrap = document.createElement('div');
  wrap.className = 'edit-form';
  wrap.innerHTML = fields.map(f => {
    const v = values[f.key];
    if(f.type === 'textarea'){
      return `<div class="form-row"><label>${escapeHtml(f.label)}</label><textarea data-key="${f.key}" rows="${f.rows||4}">${escapeHtml(v||'')}</textarea></div>`;
    }
    if(f.type === 'checkbox'){
      return `<div class="form-row inline"><label><input type="checkbox" data-key="${f.key}" ${v?'checked':''}> ${escapeHtml(f.label)}</label></div>`;
    }
    if(f.type === 'number'){
      return `<div class="form-row"><label>${escapeHtml(f.label)}</label><input type="number" data-key="${f.key}" value="${v ?? 0}"></div>`;
    }
    if(f.type === 'datalist'){
      // 下拉選單 + 手動輸入：用原生 <input list> + <datalist>，瀏覽器自動帶 autocomplete UI
      // 使用者可以從 dropdown 選現有選項，也可以打字新增（新項目下次編輯就會出現在 dropdown）
      const opts = _resolveOptions(f);
      const listId = `dl-${f.key}-${Math.random().toString(36).slice(2,7)}`;
      const optionsHtml = opts.map(o => `<option value="${escapeHtml(o)}"></option>`).join('');
      return `<div class="form-row"><label>${escapeHtml(f.label)}</label><input type="text" data-key="${f.key}" value="${escapeHtml(v||'')}" list="${listId}" placeholder="點 ▼ 從現有選項選，或直接輸入"><datalist id="${listId}">${optionsHtml}</datalist></div>`;
    }
    if(f.type === 'tags'){
      // 多標籤：input 仍用「逗號分隔」格式，但下方加可點擊的「現有標籤」chip 快速加入
      const tagStr = Array.isArray(v) ? v.join(', ') : (v || '');
      const opts = _resolveOptions(f);
      const sugHtml = opts.length
        ? `<div class="tag-suggestions"><span class="small muted">點選加入：</span>${opts.map(t => `<button type="button" class="tag-suggest" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}</div>`
        : '';
      return `<div class="form-row"><label>${escapeHtml(f.label)}</label><input type="text" data-key="${f.key}" value="${escapeHtml(tagStr)}" placeholder="例：景點, 必訪, 美食">${sugHtml}</div>`;
    }
    return `<div class="form-row"><label>${escapeHtml(f.label)}</label><input type="text" data-key="${f.key}" value="${escapeHtml(v||'')}"></div>`;
  }).join('') + `<div class="form-actions"><button type="button" class="btn secondary cancel-btn">取消</button><button type="button" class="btn save-btn">儲存</button></div>`;

  // tag 建議按鈕：點擊後 append 到 tags input（避免重複）
  wrap.querySelectorAll('.tag-suggest').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = wrap.querySelector('input[data-key="tags"]');
      if(!input) return;
      const tag = btn.dataset.tag;
      const cur = input.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
      if(!cur.includes(tag)){
        cur.push(tag);
        input.value = cur.join(', ');
      }
      input.focus();
    });
  });

  wrap.querySelector('.save-btn').addEventListener('click', ()=>{
    const result = {...values};
    fields.forEach(f => {
      const el = wrap.querySelector(`[data-key="${f.key}"]`);
      if(!el) return;
      if(f.type === 'checkbox') result[f.key] = el.checked;
      else if(f.type === 'number') result[f.key] = Number(el.value || 0);
      else if(f.type === 'tags') result[f.key] = el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
      else result[f.key] = el.value;
    });
    onSave(result);
  });
  wrap.querySelector('.cancel-btn').addEventListener('click', ()=>{
    state.editing = null;
    renderAll();
  });
  return wrap;
}

// 編輯 / 刪除 按鈕組
function makeToolbar(opts){
  const wrap = document.createElement('div');
  wrap.className = 'tools';
  if(opts.onEdit){
    const b = document.createElement('button');
    b.className = 'icon-btn';
    b.title = '編輯';
    b.innerHTML = ICONS.edit;
    b.addEventListener('click', e => { e.stopPropagation(); opts.onEdit(); });
    wrap.appendChild(b);
  }
  if(opts.onDelete){
    const b = document.createElement('button');
    b.className = 'icon-btn danger';
    b.title = '刪除';
    b.innerHTML = ICONS.trash;
    b.addEventListener('click', e => { e.stopPropagation(); if(confirm('確定刪除這一筆？')) opts.onDelete(); });
    wrap.appendChild(b);
  }
  return wrap;
}

function makeAddBtn(label, onClick){
  const b = document.createElement('button');
  b.className = 'add-btn';
  b.innerHTML = `${ICONS.plus} ${escapeHtml(label)}`;
  b.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  return b;
}

// 點卡片切換地圖
function bindMapClick(card, mapId){

}

function renderMainTabs(){

// ============== 地圖資訊面板 ==============
function renderMapPanel(){
  $$('#mapSubTabs .sub-tab').forEach(b => b.classList.toggle('active', b.dataset.sub === state.activeMapSub));

  state.currentLocations = buildLocations();

  const cont = $('#mapSubContent');
  cont.innerHTML = '';

  if(state.activeMapSub === 'days') renderDaysSubTab(cont);
  else if(state.activeMapSub === 'all') renderAllLocationsSubTab(cont);
  else if(state.activeMapSub === 'favorites') renderFavoritesSubTab(cont);
  else if(state.activeMapSub === 'stay') renderStaySubTab(cont);

  applyMapView();

function renderDaysSubTab(container){
  const data = state.data;
  const days = data.days || [];

  // 日期切換 + 新增日
  const dayTabs = document.createElement('div');
  dayTabs.className = 'sub-tabs secondary';
  days.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.className = 'sub-tab' + (day.key === state.activeDay ? ' active' : '');
    btn.textContent = day.label || `Day ${i+1}`;
    btn.addEventListener('click', ()=>{
      state.activeDay = day.key;
      // 若目前是「全日地圖」模式，同步切換到該日
      if(state.mapMode === 'allDay') state.allDayKey = day.key;
      renderMapPanel();
    });
    dayTabs.appendChild(btn);
  });
  dayTabs.appendChild(makeAddBtn('新增日', ()=>{
    mutate(d => {
      d.days = d.days || [];
      const key = 'day' + (d.days.length + 1) + '_' + uid();
      d.days.push({key, label:`Day ${d.days.length+1}`, title:'', theme:'', hero:'', stops:[]});
      state.activeDay = key;
      state.editing = `day:${key}`;
    });
  }));
  container.appendChild(dayTabs);

  if(!days.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '尚無行程，請新增一日';
    container.appendChild(empty);
    return;
  }

  let day = days.find(d => d.key === state.activeDay) || days[0];
  if(state.activeDay !== day.key) state.activeDay = day.key;

  // day header (可編輯)
  if(state.editing === `day:${day.key}`){
    container.appendChild(buildEditForm(FIELD_DEFS.day, day, v => {
      mutate(d => {
        const idx = d.days.findIndex(x => x.key === day.key);
        const oldKey = d.days[idx].key;
        d.days[idx] = {...d.days[idx], ...v};
        if(oldKey !== v.key) state.activeDay = v.key;
        state.editing = null;
      });
    }));
  } else {
    const header = document.createElement('div');
    header.className = 'day-header';
    header.dataset.editId = `day:${day.key}`;
    header.style.position = 'relative';
    const isAllDayActive = state.mapMode === 'allDay' && state.allDayKey === day.key;
    // 本日行程目錄：依順序列出每個 stop（編號 + 時間 + 名稱），點擊跳到對應 stop card
    // 折疊狀態：全域共用 state.outlineCollapsedAll（所有 day 連動，一開全開、一收全收），預設展開
    if(typeof state.outlineCollapsedAll === 'undefined') state.outlineCollapsedAll = false;
    const isOutlineCollapsed = !!state.outlineCollapsedAll;
    const stopList = day.stops || [];
    const outlineHtml = stopList.length ? `
      <div class="day-outline${isOutlineCollapsed?' collapsed':''}">
        <button type="button" class="day-outline-title" aria-expanded="${!isOutlineCollapsed}">
          <span class="day-outline-toggle" aria-hidden="true"></span>
          本日行程（${stopList.length}）
        </button>
        <div class="day-outline-list">
          ${stopList.map((s, i) => {
            const hasName = nonEmpty(s.name);
            const name = escapeHtml(hasName ? s.name : '(未命名)');
            const timeHtml = nonEmpty(s.time) ? `<span class="outline-time">${escapeHtml(s.time)}</span>` : '';
            return `<button type="button" class="outline-item" data-stop-idx="${i}">
              <span class="outline-num">${i+1}</span>${timeHtml}<span class="outline-name${hasName?'':' muted-name'}">${name}</span>
            </button>`;
          }).join('')}
        </div>
      </div>` : '';
    header.innerHTML = `
      <div class="small muted">${escapeHtml(day.label||'')}</div>
      <div style="font-size:22px;font-weight:800;margin-top:4px">${escapeHtml(day.title||'')}</div>
      ${nonEmpty(day.theme)?`<div class="muted small" style="margin-top:6px">${escapeHtml(day.theme)}</div>`:''}
      ${nonEmpty(day.hero)?`<div style="margin-top:8px"><span class="badge">重點：${escapeHtml(day.hero)}</span></div>`:''}
      <div class="actions" style="margin-top:12px">
        <button type="button" class="btn ${isAllDayActive?'':'secondary'} show-all-day-btn">${isAllDayActive ? '✓ 已顯示全日路線' : '🗺 將當日全部地點顯示在地圖上'}</button>
      </div>
      ${outlineHtml}
    `;
    header.querySelector('.show-all-day-btn').addEventListener('click', e => {
      e.stopPropagation();
      if(state.mapMode === 'allDay' && state.allDayKey === day.key){
        state.mapMode = 'single';
        state.allDayKey = '';
      } else {
        state.mapMode = 'allDay';
        state.allDayKey = day.key;
      }
      renderMapPanel();
    });
    // 行程目錄項目：
    //   hover  → 「全日路線」模式下，地圖對應 marker popup 自動彈出（不平移、不打斷探索）
    //   click  → 跳出全日模式、地圖切到該地點單點視圖、stop card 卷動 + 閃光
    header.querySelectorAll('.outline-item').forEach(el => {
      // hover 觸發 popup（限全日模式 + 同一個 day）
      el.addEventListener('mouseenter', () => {
        if(state.mapMode !== 'allDay' || state.allDayKey !== day.key) return;
        const idx = parseInt(el.dataset.stopIdx, 10);
        openAllDayStopPopup(day.key, idx);
      });
      // 點擊 → 跳出全日 + 跳該地點
      el.addEventListener('click', e => {
        e.stopPropagation();
        const idx = parseInt(el.dataset.stopIdx, 10);
        const stopid = `${day.key}:${idx}`;
        // 強制離開全日路線模式（即使 stop 沒填 map，也要退出全日；jumpToStop 內部只在 hasMap 時才 reset，所以這裡先設好）
        state.mapMode = 'single';
        state.allDayKey = '';
        // jumpToStop 會做：切到地圖 tab + 該 day + 設 currentMapId（若有 map）+ renderAll + scrollIntoView + active-map
        jumpToStop(day.key, idx);
        // 額外加閃光提示（jumpToStop 內 renderAll 後 DOM 才重建，要等下一個 frame 才能找到新的 card 節點）
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const card = document.querySelector(`.stop-card[data-stopid="${CSS.escape(stopid)}"]`);
          if(!card) return;
          card.classList.remove('flash');
          void card.offsetWidth;
          card.classList.add('flash');
        }));
      });
    });
    // 行程目錄折疊：直接 in-place toggle DOM + 寫回全域 state（切到其他 day 後仍維持同樣的折疊狀態）
    const outlineTitleBtn = header.querySelector('.day-outline-title');
    if(outlineTitleBtn){
      outlineTitleBtn.addEventListener('click', e => {
        e.stopPropagation();
        const outlineEl = outlineTitleBtn.closest('.day-outline');
        outlineEl.classList.toggle('collapsed');
        const collapsed = outlineEl.classList.contains('collapsed');
        outlineTitleBtn.setAttribute('aria-expanded', String(!collapsed));
        state.outlineCollapsedAll = collapsed;
      });
    }
    header.appendChild(makeToolbar({
      onEdit: ()=>{ state.editing = `day:${day.key}`; renderAll(); },
      onDelete: ()=>{
        mutate(d => {
          const idx = d.days.findIndex(x => x.key === day.key);
          d.days.splice(idx, 1);
          state.activeDay = d.days[0]?.key || '';
          state.editing = null;
        });
      }
    }));
    container.appendChild(header);
  }

  // stops
  (day.stops||[]).forEach((stop, idx) => {
    const editId = `stop:${day.key}:${idx}`;
    if(state.editing === editId){
      container.appendChild(buildEditForm(FIELD_DEFS.stop, stop, v => {
        mutate(d => {
          const di = d.days.findIndex(x => x.key === day.key);
          d.days[di].stops[idx] = {...d.days[di].stops[idx], ...v};
          // 填入/修改時間後自動按 time 排序，讓新地點插到對的時段裡
          d.days[di].stops = sortStopsByTime(d.days[di].stops);
          state.editing = null;
        });
      }));
    } else {
      container.appendChild(renderStopCard(day, stop, idx));
    }
  });

  // 新增 stop
  container.appendChild(makeAddBtn('新增行程', ()=>{
    mutate(d => {
      const di = d.days.findIndex(x => x.key === day.key);
      d.days[di].stops = d.days[di].stops || [];
      d.days[di].stops.push({time:'', name:'', maps_label:'', short_address:'', stay:'', cost:'', address:'', tags:[], note:'', next:'', map:'', highlight:false});
      state.editing = `stop:${day.key}:${d.days[di].stops.length - 1}`;
    });
  }));
}

function renderStopCard(day, stop, idx){
  const mapId = `day-${day.key}-${idx}`;
  const mapTarget = getMap(stop);
  const card = document.createElement('div');
  card.className = 'item-card stop-card' + (mapTarget ? ' map-target' : '');
  card.dataset.stopid = `${day.key}:${idx}`;
  card.dataset.editId = `stop:${day.key}:${idx}`;
  if(mapTarget) card.dataset.mapid = mapId;
  const tags = Array.isArray(stop.tags) ? stop.tags : [];

  // 找下一站：同一天 idx+1，或下一天的第一站（自動取得，不需手動填寫）
  const days = state.data.days || [];
  const dayIdx = days.findIndex(d => d.key === day.key);
  let nextDayKey = '', nextStopIdx = -1, nextStop = null;
  if(idx + 1 < (day.stops||[]).length){
    nextDayKey = day.key;
    nextStopIdx = idx + 1;
    nextStop = day.stops[idx + 1];
  } else if(dayIdx >= 0 && days[dayIdx+1] && (days[dayIdx+1].stops||[]).length > 0){
    nextDayKey = days[dayIdx+1].key;
    nextStopIdx = 0;
    nextStop = days[dayIdx+1].stops[0];
  }

  let nextHtml = '';
  if(nextStop){
    const nextLabel = nextStop.name || '(未命名)';
    nextHtml = `<button type="button" class="next-btn" data-next-day="${escapeHtml(nextDayKey)}" data-next-idx="${nextStopIdx}">下一站：${escapeHtml(nextLabel)}</button>`;
  }

  // 停留時間：優先用「時間區間」自動算，沒填區間才退回舊版手填的 stop.stay 欄位（向後相容）
  const stayText = computeStayDuration(stop.time) || stop.stay;

  card.innerHTML = `
    <div class="stop-top">
      <div>
        <div class="stop-title">${escapeHtml(stop.name||'(未命名)')} ${stop.highlight?'<span class="badge">重點</span>':''}</div>
        <div class="stop-meta">
          ${nonEmpty(stop.time) ? `<span class="time-pill">${escapeHtml(stop.time)}</span>` : ''}
          ${nonEmpty(stayText) ? `<span class="pill">${escapeHtml(stayText)}</span>` : ''}
        </div>
      </div>
      ${nonEmpty(stop.cost) ? `<div class="cost-pill">${escapeHtml(stop.cost)}</div>` : ''}
    </div>
    ${tags.length ? `<div class="tag-list">${tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    ${nonEmpty(stop.address) ? `<div class="addr-box"><div class="small muted">地址</div><div>${escapeHtml(stop.address)}</div></div>` : ''}
    ${nonEmpty(stop.note) ? `<div class="md" style="margin-top:10px">${renderMd(stop.note)}</div>` : ''}
    ${nextHtml ? `<div class="actions">${nextHtml}</div>` : ''}
  `;

  const nextBtn = card.querySelector('.next-btn');
  if(nextBtn){
    nextBtn.addEventListener('click', e => {
      e.stopPropagation();
      jumpToStop(nextDayKey, nextStopIdx);
    });
  }

  card.appendChild(makeToolbar({
    onEdit: ()=>{ state.editing = `stop:${day.key}:${idx}`; renderAll(); },
    onDelete: ()=>{
      mutate(d => {
        const di = d.days.findIndex(x => x.key === day.key);
        d.days[di].stops.splice(idx, 1);
        state.editing = null;
      });
    }
  }));

  // 所有 stop card 都可點擊：有 map 切地圖；沒 map 只 highlight 卡片，地圖保持原狀
  card.addEventListener('click', e => {
    if(e.target.closest('.icon-btn, button, a, input, textarea, .edit-form, .next-btn')) return;
    state.activeStopId = `${day.key}:${idx}`;
    if(mapTarget){
      focusMap(mapId);
    } else {
      highlightActiveMap();
    }
  });
  return card;
}

function getMergedTags(stop){
  if(!Array.isArray(stop.tags)) return [];
  return [...new Set(stop.tags.map(t => String(t).trim()).filter(Boolean))];
}

function renderAllLocationsSubTab(container){
  const data = state.data;
  // 收集所有 stops（含 tag、來源 day 資訊）
  const allStops = [];
  (data.days||[]).forEach((day, di) => {
    (day.stops||[]).forEach((stop, si) => {
      const tags = getMergedTags(stop);
      allStops.push({ day, dayIndex: di, stop, stopIndex: si, tags });
    });
  });

  // 收集所有 tags 並計數
  const tagCount = new Map();
  allStops.forEach(s => s.tags.forEach(t => tagCount.set(t, (tagCount.get(t)||0) + 1)));
  const allTags = [...tagCount.keys()].sort();
  const untaggedCount = allStops.filter(s => s.tags.length === 0).length;

  // tag tabs
  const tagTabs = document.createElement('div');
  tagTabs.className = 'sub-tabs secondary';

  const allBtn = document.createElement('button');
  allBtn.className = 'sub-tab' + (state.activeTag === '__all__' ? ' active' : '');
  allBtn.textContent = `全部 (${allStops.length})`;
  allBtn.addEventListener('click', () => { state.activeTag = '__all__'; renderMapPanel(); });
  tagTabs.appendChild(allBtn);

  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'sub-tab' + (state.activeTag === tag ? ' active' : '');
    btn.textContent = `${tag} (${tagCount.get(tag)})`;
    btn.addEventListener('click', () => { state.activeTag = tag; renderMapPanel(); });
    tagTabs.appendChild(btn);
  });

  if(untaggedCount > 0){
    const btn = document.createElement('button');
    btn.className = 'sub-tab' + (state.activeTag === '__none__' ? ' active' : '');
    btn.textContent = `未標籤 (${untaggedCount})`;
    btn.addEventListener('click', () => { state.activeTag = '__none__'; renderMapPanel(); });
    tagTabs.appendChild(btn);
  }

  container.appendChild(tagTabs);

  // 篩選
  let filtered = allStops;
  if(state.activeTag === '__none__') filtered = allStops.filter(s => s.tags.length === 0);
  else if(state.activeTag !== '__all__') filtered = allStops.filter(s => s.tags.includes(state.activeTag));

  if(!filtered.length){
    container.appendChild(Object.assign(document.createElement('div'), {className:'empty', textContent:'沒有符合此標籤的項目'}));
    return;
  }

  // 重用 renderStopCard，加上「來自哪一天」的標記
  filtered.forEach(s => {
    const editId = `stop:${s.day.key}:${s.stopIndex}`;
    if(state.editing === editId){
      container.appendChild(buildEditForm(FIELD_DEFS.stop, s.stop, v => {
        mutate(d => {
          const di = d.days.findIndex(x => x.key === s.day.key);

// ============== 時程表 (Excel 風格) ==============
const TIME_GROUPS = [
  {label:'早', hours:[6,7,8,9,10,11,12]},
  {label:'午', hours:[13,14,15,16,17,18]},
  {label:'晚', hours:[19,20,21,22,23,0]}
];

// 解析 stop.time 字串，支援 "09:30–13:20" / "09:30-13:20" / "9:30~10:00"
function parseHours(t){
  if(!t) return null;
  const m = String(t).match(/(\d{1,2}):(\d{2})\s*[–\-~～]\s*(\d{1,2}):(\d{2})/);
  if(m) return { startH:+m[1], startM:+m[2], endH:+m[3], endM:+m[4] };
  const single = String(t).match(/(\d{1,2}):(\d{2})/);
  if(single) return { startH:+single[1], startM:+single[2], endH:+single[1], endM:+single[2]+30 };
  return null;
}

// 計算每天每個半小時格子的內容 (rowspan 合併)
// 用「半小時 slot」做粒度避免「17:00-18:30」和「18:30-19:00」這種共用整點的 stop 衝突：
//   - 整點粒度時：17:00-18:30 會把 hour 17 和 18 都標 occupied（因為 endM=30 → span+=1），
//     導致 18:30-19:00 找不到空格被丟掉
//   - 半小時粒度時：17:00-18:30 占 slots [17:00, 17:30, 18:00] (3 格)，18:30-19:00 占 slot [18:30] (1 格)，互不衝突
// slot 編號：hour*2 + (minute>=30 ? 1 : 0)，一天共 48 slots（key 0..47）
function buildDayCells(day){
  const cells = {};
  const occupied = {};
  (day.stops||[]).forEach((stop, sIdx) => {
    const h = parseHours(stop.time);
    if(!h) return;
    let startSlot = h.startH * 2 + (h.startM >= 30 ? 1 : 0);
    // 結束 slot：endM 在 (0, 30] 視為延伸到「該 hour 的下半」結束 → 占用半 slot
    //          endM 在 (30, 60) 視為延伸到「下一 hour 的上半」結束 → 占用 1 slot
    //          endM === 0 視為剛好結束於整點 → 不占額外 slot
    let endSlot = h.endH * 2 + (h.endM === 0 ? 0 : (h.endM <= 30 ? 1 : 2));
    if(endSlot <= startSlot) endSlot = startSlot + 1;

    // 從 startSlot 找最大連續未佔區間
    let s = startSlot;
    while(s < endSlot && occupied[s % 48]) s++;
    let e = s;
    while(e < endSlot && !occupied[e % 48]) e++;
    if(e <= s) return;

    const startKey = s % 48;
    cells[startKey] = { stop, idx: sIdx, isStart: true, span: e - s, dayKey: day.key };
    for(let i = s; i < e; i++){
      occupied[i % 48] = true;
      if(i !== s) cells[i % 48] = { occupied: true };
    }
  });
  return cells;
}

function renderSchedulePanel(){
  const data = state.data;
  const cont = $('#scheduleContent');
  if(!cont) return;
  const days = data.days || [];
  if(!days.length){ cont.innerHTML = '<div class="empty">尚無行程資料</div>'; return; }

  const dayMaps = days.map(buildDayCells);

  let html = '<div class="schedule-wrap"><table class="schedule"><colgroup><col class="col-group"><col class="col-hour">';
  days.forEach(() => html += '<col class="col-day">');
  html += '</colgroup><thead><tr><th>時段</th><th>時刻</th>';
  days.forEach(d => {
    const subTitle = (d.title||'').slice(0, 18);
    html += `<th>${escapeHtml(d.label||'')}${subTitle ? `<div class="day-sub">${escapeHtml(subTitle)}</div>`:''}</th>`;
  });
  html += '</tr></thead><tbody>';

  TIME_GROUPS.forEach(group => {
    // 把每個 hour 展開成兩個半小時 slots: :00 和 :30
    const slots = [];
    group.hours.forEach(hour => {
      slots.push({ hour, minute: 0 });
      slots.push({ hour, minute: 30 });
    });
    slots.forEach((slot, si) => {
      html += '<tr>';
      if(si === 0){
        html += `<th rowspan="${slots.length}" class="time-group">${group.label}</th>`;
      }
      const hourStr = (slot.hour < 10 ? '0' + slot.hour : slot.hour);
      const slotKey = slot.hour * 2 + (slot.minute === 30 ? 1 : 0);
      // 半小時 row 的「:30」label 用淡色，視覺上保留「整點為主」的閱讀體驗
      const labelCls = slot.minute === 30 ? 'hour-cell hour-half' : 'hour-cell';
      html += `<td class="${labelCls}">${hourStr}:${slot.minute === 0 ? '00' : '30'}</td>`;
      days.forEach((day, di) => {
        const cell = dayMaps[di][slotKey];
        if(cell?.occupied) return; // 上面 rowspan 已覆蓋
        if(cell?.isStart){
          const stop = cell.stop;
          const cls = 'stop-cell' + (stop.highlight ? ' highlight' : '');
          html += `<td rowspan="${cell.span}" class="${cls}" data-day="${escapeHtml(day.key)}" data-idx="${cell.idx}"><div class="stop-cell-name">${escapeHtml(stop.name||'')}</div>${nonEmpty(stop.time)?`<div class="stop-cell-time">${escapeHtml(stop.time)}</div>`:''}</td>`;
        } else {
          html += '<td class="empty-cell"></td>';
        }
      });
      html += '</tr>';
    });
  });
  html += '</tbody></table></div>';
  cont.innerHTML = html;

  cont.querySelectorAll('.stop-cell').forEach(td => {
    td.addEventListener('click', () => {
      jumpToStop(td.dataset.day, +td.dataset.idx);
    });
  });
}
