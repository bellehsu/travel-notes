  (state.data.days||[]).forEach(day => (day.stops||[]).forEach((stop, si) => {
    const push = (raw) => {
      if(!raw) return;
      let u = String(raw).trim().replace(/[\.,;:!?]+$/, '');
      if(!/^https?:\/\//i.test(u)) return;
      if(SKIP_URL_PATTERN.test(u)) return;
      list.push({ url: u, stopName: stop.name, dayKey: day.key, idx: si });
    };
    push(stop.link);
    if(nonEmpty(stop.note)){
      const matches = String(stop.note).matchAll(URL_REGEX);
      for(const m of matches) push(m[0]);
    }
  }));
  return list;
}

// HTML entities decode (給 title 文字用)
function decodeEntities(s){
  const t = document.createElement('textarea');
  t.innerHTML = s;
  return t.value;
}

// 透過多個 CORS proxy 抓 HTML（依序 fallback）
async function fetchHtmlViaProxy(url){
  const mkOpts = () => {
    const o = {};
    try { if(typeof AbortSignal !== 'undefined' && AbortSignal.timeout) o.signal = AbortSignal.timeout(15000); } catch {}
    return o;
  };
  const attempts = [
    // Jina Reader: 直接 follow redirect 並回傳乾淨內容（最穩，無 CORS）
    { name: 'jina', fn: async () => {
      const r = await fetch(`https://r.jina.ai/${url}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }},
    // allorigins
    { name: 'allorigins', fn: async () => {
      const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, mkOpts());
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json();
      return (j && j.contents) || null;
    }},
    // corsproxy.io
    { name: 'corsproxy', fn: async () => {
      const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }},
    // codetabs
    { name: 'codetabs', fn: async () => {
      const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }},
    // thingproxy
    { name: 'thingproxy', fn: async () => {
      const r = await fetch(`https://thingproxy.freeboard.io/fetch/${url}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }}
  ];
  for(const a of attempts){
    try {
      const result = await a.fn();
      if(result){
        console.info(`[Proxy] ${a.name} OK，長度 ${result.length}`);
        return result;
      }
      console.warn(`[Proxy] ${a.name} 回傳空內容`);
    } catch (e) {
      console.warn(`[Proxy] ${a.name} 失敗:`, (e && e.message) || e);
    }
  }
  return null;
}

// 共用 HTML cache：同一個 URL 的代理抓取結果只取一次，給「短網址解析」與「meta 抽取」共用
const mapHtmlCache = new Map();
async function fetchMapHtmlCached(url){
  if(!url) return null;
  if(mapHtmlCache.has(url)) return mapHtmlCache.get(url);
  let html = null;
  try { html = await fetchHtmlViaProxy(url); } catch { html = null; }
  mapHtmlCache.set(url, html || null);
  return html;
}

// 從 Google Maps 抓回的 HTML 抽店名與完整地址（給 resolveGoogleShortUrl 與 fetchMapMeta 共用）
// 判斷一段文字「看起來是不是真實地址」
// 用來防止 Google Maps 的 description（例如「Bustling pedestrian street on a hill lined with ... Japanese architecture.」）
// 被誤抓當地址 — 那種句子用來 geocoding 會跑到完全不相干的地點（例：京都的三年坂跑到東京某條 pedestrian street）
function looksLikeAddress(addr){
  if(!addr || typeof addr !== 'string') return false;
  const s = addr.trim();
  if(s.length < 4) return false;
  // 中日韓地址典型結構（〒、丁目、番地、區、市、町、路、街、巷）
  if(/〒|丁目|番地|号|區|区|[市][^\s,，、]{0,8}?[區区町]|路\s*\d|街\s*\d/.test(s)) return true;
  // 英譯日本地址（Chome / Ward / 5 碼郵編）
  if(/\bChome\b|\bWard\b|\b\d{3}-\d{4}\b/.test(s)) return true;
  // 末尾是國名（最有公信力的地址結尾型態）
  if(/,\s*(?:Japan|Korea|Taiwan|USA|United\s+States|UK|Canada|Australia)\s*$/i.test(s)) return true;
  // 西式門牌：「123 Main Street」之類
  if(/^\d+\s+\S/.test(s) && /\b(?:Street|St\.|Avenue|Ave\.?|Road|Rd\.?|Boulevard|Blvd\.?)\b/i.test(s)) return true;
  return false;
}

function extractMapTitleAndAddr(html){
  if(!html) return { title:'', addr:'' };
  // 店名：取第一個非「Google Maps」的 # 標題，並去掉尾巴的 " - Google Maps"
  let title = '';
  const titleMatches = html.match(/(?:^|\n)#+\s+([^\n]+)/g);
  if(titleMatches){
    for(const tm of titleMatches){
      let t = tm.replace(/^[\s\n]*#+\s+/, '').trim();
      t = t.replace(/\s*[-–—]\s*Google Maps\s*$/i, '').trim();
      if(t && !/^Google Maps$/i.test(t)){ title = t; break; }
    }
  }
  // 完整地址：依嚴格度由高到低嘗試多個 pattern，找到第一個「看起來像地址」的就採用
  // 注意：直接寫 /Japan/ 會誤命中 description 裡的「Japanese」，因此末尾兜底用 \bJapan\b 詞邊界
  const candidates = [];
  let m;
  // 1) Japan, 〒XXX-XXXX 開頭
  if((m = html.match(/Japan,\s*〒[^\n]+/i))) candidates.push(m[0]);
  // 2) 〒XXX-XXXX 開頭
  if((m = html.match(/〒\s*\d{3}[-－\d]+[^\n]+/))) candidates.push(m[0]);
  // 3) 英譯日本地址：「N Chome-NN XXX, ... Ward, ...」
  if((m = html.match(/(?:^|\n)\s*(\d+\s+Chome[-\s][^\n]{4,180}?(?:Ward|City|Town|\bJapan\b|Kyoto|Tokyo|Osaka)[^\n]*)/i))) candidates.push(m[1]);
  // 4) 結尾為「, Japan」的整行地址（最可靠：description 通常以句號或省略號結尾，不會這樣結尾）
  if((m = html.match(/(?:^|\n)\s*([^\n]{6,180}?,\s+Japan)\s*(?:\n|$)/i))) candidates.push(m[1]);
  // 5) 中文地址（含 市/區/町/丁目）
  if((m = html.match(/(?:^|\n)\s*([^\n]{4,80}?(?:[市][^\n]{0,30}?[区區町]|丁目|番地)[^\n]{0,40})/))) candidates.push(m[1]);
  // 6) 兜底：含地理關鍵字的一行（用詞邊界 \bJapan\b / \bCity\b / \bWard\b 防止匹配 Japanese / Citywide 等）
  if((m = html.match(/(?:^|\n)\s*([^\n]{6,120}(?:Tokyo|Osaka|Kyoto|\bJapan\b|Taiwan|Taipei|\bCity\b|\bWard\b|區|市|町|路|街|丁目)[^\n]*)/))) candidates.push(m[1]);

  let addr = '';
  for(const c of candidates){
    let s = c.replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ');
    s = s.replace(/\s*\[[^\]]*\]\([^)]*\)\s*$/g, '').replace(/[`*]/g, '').trim();
    if(looksLikeAddress(s)){ addr = s; break; }
  }
  return { title, addr };
}

// 抓 Google Maps 連結 meta（店名 + 地址）：自動帶入欄位用，有 cache
const mapMetaCache = new Map();
// 已經做過「壞 address 偵測修復」的 item 集合（避免無限循環修復；用 WeakSet 不會阻止 GC）
const _addressVerifiedItems = new WeakSet();
async function fetchMapMeta(mapUrl){
  if(!mapUrl) return null;
  if(mapMetaCache.has(mapUrl)) return mapMetaCache.get(mapUrl);
  const html = await fetchMapHtmlCached(mapUrl);
  if(!html){ mapMetaCache.set(mapUrl, null); return null; }
  const meta = extractMapTitleAndAddr(html);
  if(!meta.title && !meta.addr){ mapMetaCache.set(mapUrl, null); return null; }
  mapMetaCache.set(mapUrl, meta);
  return meta;
}

// 從完整地址推導「簡短地址」(只取到 市/區/町 層級)
// 例：「京都市上京區京都御苑 3」→「京都市上京區」；「桃園市大園區航站南路 9 號」→「桃園市大園區」
function deriveShortAddress(addr){
  if(!addr) return '';
  let s = String(addr).trim();
  // 去除 Japan, 〒XXX-XXXX 開頭
  s = s.replace(/^Japan,?\s*/i, '').replace(/^〒\s*\d{3}[-－\d]+\s*/, '').trim();
  // 1) 「○○(都/府/県/縣)○○市○○區/町」：抓到區/町為止
  let m = s.match(/([^\s,，、]*?[都府県縣]?[^\s,，、]*?[市][^\s,，、]*?[区區町])/);
  if(m && m[1]) return m[1];
  // 2) 只到市為止（無區）
  m = s.match(/([^\s,，、]*?[市])/);
  if(m && m[1] && m[1].length >= 2) return m[1];
  // 3) 只有區/町
  m = s.match(/([^\s,，、]*?[区區町])/);
  if(m && m[1] && m[1].length >= 2) return m[1];
  // 4) fallback：取第一個分隔前段，最多 14 字
  m = s.match(/^([^\s,，、]{2,14})/);
  return m ? m[1] : s.slice(0, 14);
}

// 將 meta 中可用資訊填入 item 空欄位（不覆蓋使用者已填）
// 用 `'key' in item` 判斷此 item 類型是否支援該欄位，避免在 stay/shop item 多塞 maps_label
function autoFillItemFromMeta(item, meta){
  if(!item || !meta) return false;
  let changed = false;
  if(('maps_label' in item) && !nonEmpty(item.maps_label) && nonEmpty(meta.title)){
    item.maps_label = meta.title;
    changed = true;
  }
  if(('address' in item) && !nonEmpty(item.address) && nonEmpty(meta.addr) && looksLikeAddress(meta.addr)){
    item.address = meta.addr;
    changed = true;
  }
  if(('short_address' in item) && !nonEmpty(item.short_address)){
    const s = deriveShortAddress(item.address || meta.addr);
    if(nonEmpty(s)){ item.short_address = s; changed = true; }
  }
  return changed;
}

// 解析 Google Maps 短網址 (maps.app.goo.gl / goo.gl/maps) 取得可用的地圖目標 URL
// 因為 Google Maps 是 SPA，proxy 抓回的 HTML/markdown 不一定有純 lat/lng；
// 所以這個函式會盡可能用所有可用線索組成 embed URL：
//   優先順序：店名+地址（顯示完整店家面板） > lat/lng > Plus Code > 地址 > 店名
async function resolveGoogleShortUrl(shortUrl){
  if(!shortUrl) return null;
  const html = await fetchMapHtmlCached(shortUrl);
  if(!html) return null;

  const { title, addr } = extractMapTitleAndAddr(html);
  // 同步把 meta 寫入 cache，後續 autofill 不必再抓一次
  if(title || addr){ mapMetaCache.set(shortUrl, { title, addr }); }

  // 1. 最佳：店名 + 完整地址 (Google Maps embed 對精準店家會自動展開資訊面板)
  if(title && addr){
    const q = `${title}, ${addr}`.slice(0, 250);
    return `https://maps.google.com/?q=${encodeURIComponent(q)}`;
  }

  // 2. og:url / canonical (含 @lat,lng 的長網址)
  let m = html.match(/<meta[^>]+property=["']og:url["'][^>]+content=["']([^"']+)["']/i)
       || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:url["']/i);
  if(m && /google\./i.test(m[1]) && /@-?\d+\.\d+/.test(m[1])) return m[1];
  m = html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i)
   || html.match(/<link[^>]+href=["']([^"']+)["'][^>]+rel=["']canonical["']/i);
  if(m && /google\./i.test(m[1]) && /@-?\d+\.\d+/.test(m[1])) return m[1];

  // 3. 完整 Google Maps URL 含 @lat,lng
  m = html.match(/(https?:\/\/(?:www\.)?google\.[a-z.]+\/maps[^\s)"'<>\\\]\(]*@-?\d+\.\d+,-?\d+\.\d+[^\s)"'<>\\\]\(]*)/i);
  if(m) return m[1];

  // 4. !3d!4d 隱藏在 URL data 部分的座標
  m = html.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m){
    const q = title ? `${title} @${m[1]},${m[2]}` : `${m[1]},${m[2]}`;
    return `https://maps.google.com/?q=${encodeURIComponent(q)}`;
  }

  // 5. ?ll= / ?center= / @lat,lng
  m = html.match(/[?&](?:ll|center)=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/i)
   || html.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
  if(m){
    const q = title ? `${title} @${m[1]},${m[2]}` : `${m[1]},${m[2]}`;
    return `https://maps.google.com/?q=${encodeURIComponent(q)}`;
  }

  // 6. 只有店名沒地址 → 用店名搜尋（也常能命中單一結果並展開資訊面板）
  if(title){
    return `https://maps.google.com/?q=${encodeURIComponent(title)}`;
  }

  // 7. 只有地址沒店名
  if(addr){
    return `https://maps.google.com/?q=${encodeURIComponent(addr)}`;
  }

  // 8. Plus Code (僅能定位，不會展開資訊面板，但仍勝過世界地圖)
  m = html.match(/\b([23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3})(?:\s+([^\n#`]{1,60}))?/);
  if(m){
    const code = m[1];
    const region = (m[2] || '').replace(/[`*\[\]_]/g, '').trim();
    const q = region ? `${code} ${region}` : code;
    return `https://maps.google.com/?q=${encodeURIComponent(q)}`;
  }

  return null;
}

// 從 Google Maps 完整 URL 抓 lat,lng
function extractLatLngFromGoogleUrl(url){
  if(!url) return null;
  const m = String(url).match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  try {
    const u = new URL(url);
    const q = u.searchParams.get('q') || u.searchParams.get('query');
    if(q){
      const mq = String(q).match(/(-?\d+\.\d+),(-?\d+\.\d+)/);
      if(mq) return { lat: parseFloat(mq[1]), lng: parseFloat(mq[2]) };
    }
  } catch {}
  return null;
}

// Nominatim (OpenStreetMap) 免費 geocoding：地址→lat/lng。有 cache 避免重複請求
// rate limit 1 req/s，所以我們依序呼叫（用 serial queue）
const geocodeCache = new Map();
let geocodeQueue = Promise.resolve();
async function geocodeAddress(query){
  if(!query) return null;
  const key = String(query).trim();
  if(!key) return null;
  if(geocodeCache.has(key)) return geocodeCache.get(key);
  // 串在 queue 後面，確保間隔 > 1s（Nominatim 禮貌使用規範）
  const p = geocodeQueue.then(async () => {
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(key)}`;
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const arr = await r.json();
      if(arr && arr.length && arr[0].lat && arr[0].lon){
        const ll = { lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
        geocodeCache.set(key, ll);
        return ll;
      }
    } catch(e){
      console.warn('[Geocode] 失敗', key, e.message || e);
    }
    geocodeCache.set(key, null);
    return null;
  }).then(async v => {
    // 禮貌延遲
    await new Promise(r => setTimeout(r, 1100));
    return v;
  });
  geocodeQueue = p.catch(() => {});
  return p;
}

// 短網址解析 cache，避免重複呼叫
const shortUrlCache = new Map();

// 是不是 Google Maps URL（短或長）
function isGoogleMapsUrl(url){
  return !!url && /maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google\./i.test(url);
}
// 是不是 Google Maps 短網址
function isGoogleShortUrl(url){
  return !!url && /maps\.app\.goo\.gl|goo\.gl\/maps/i.test(url);
}

// 判斷 item.map 目前是否已含 lat/lng
function mapHasCoords(url){
  if(!url) return false;
  if(/@(-?\d+\.\d+),(-?\d+\.\d+)/.test(url)) return true;
  try {
    const u = new URL(url);
    const q = u.searchParams.get('q') || u.searchParams.get('query') || '';
    return /(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/.test(q);
  } catch { return false; }
}

// 背景檢查整個 data 中的 map 欄位：
//   1) 解析短網址 → 長網址 (含座標)
//   2) 從地圖頁抓店名/地址，自動填入空的 maps_label / short_address / address
//   3) 若仍抓不到座標 → 用 Nominatim geocode(title+addr) 補座標，改寫 map 為 q=lat,lng
async function tryResolveShortMaps(){
  if(!state.data) return;
  const tasks = [];
  let changed = false;
  const failedShort = [];
  let resolvedShort = 0;
  let filledItems = 0;
  let geocoded = 0;

  const walk = (item) => {
    if(!item || !item.map) return;
    if(!isGoogleMapsUrl(item.map)) return;

    tasks.push((async () => {
      const original = String(item.map);
      let workUrl = original;

      // 1) 短網址 → 長網址
      // 重要設計：保留「店名+地址」版本的長 URL 讓 iframe 能展開 Place 面板；
      // 座標另外存到 item.lat/lng 給 Leaflet 多點地圖用，**不覆蓋 item.map 為純座標**
      if(isGoogleShortUrl(original)){
        let cached = shortUrlCache.get(original);
        if(cached === undefined){
          try {
            const longUrl = await resolveGoogleShortUrl(original);
            if(longUrl){
              const ll = extractLatLngFromGoogleUrl(longUrl);
              cached = { url: longUrl, lat: ll?.lat, lng: ll?.lng };
              shortUrlCache.set(original, cached);
              resolvedShort++;
            } else {
              shortUrlCache.set(original, null);
              failedShort.push(original);
            }
          } catch {
            shortUrlCache.set(original, null);
            failedShort.push(original);
          }
        }
        if(cached && typeof cached === 'object'){
          if(item.map === original){
            item.map = cached.url;
            changed = true;
          }
          workUrl = cached.url;
          if(cached.lat != null && cached.lng != null && (item.lat == null || item.lng == null)){
            item.lat = cached.lat;
            item.lng = cached.lng;
            changed = true;
          }
        }
      }

      // 1.4) 修復舊版壞資料：若 item.address 看起來不是真實地址（被舊 regex 從 description 誤抓），
      // 清掉它與可能被它誤導的座標，讓後續 step 2/3 重新抓 meta + geocode
      // 例：三年坂的 description「Bustling pedestrian street ... Japanese architecture.」舊版會被當成地址，
      //     用它去 geocode 就跑到東京某條 pedestrian street
      if(!_addressVerifiedItems.has(item) && nonEmpty(item.address) && !looksLikeAddress(item.address)){
        console.log('[Resolve] item.address 不像真實地址，清掉重抓：', String(item.address).slice(0, 80));
        delete item.address;
        delete item.short_address;
        delete item.lat;
        delete item.lng;
        mapMetaCache.delete(original);
        if(workUrl && workUrl !== original) mapMetaCache.delete(workUrl);
        changed = true;
      }
      _addressVerifiedItems.add(item);

      // 1.5) 搶救座標：若 item.map 有 @lat,lng 或 ?q=lat,lng，先抽到 item.lat/lng
      // 這樣之後 getMap 把 URL 重建為「店名+地址」（會丟座標）也不影響多點地圖定位
      if(item.lat == null || item.lng == null){
        const ll = extractLatLngFromGoogleUrl(item.map);
        if(ll){
          item.lat = ll.lat;
          item.lng = ll.lng;
          changed = true;
        }
      }

      // 2) 抓 meta（店名+地址）：任一條件成立就抓 — 缺欄位 / 缺座標 / 還沒 cached
      const needFill = !nonEmpty(item.maps_label) || !nonEmpty(item.short_address) || !nonEmpty(item.address);
      const hasItemCoords = (typeof item.lat === 'number' && typeof item.lng === 'number');
      const needCoords = !mapHasCoords(item.map) && !hasItemCoords;
      let meta = mapMetaCache.has(original) ? mapMetaCache.get(original) : undefined;
      if(meta === undefined && workUrl !== original){
        meta = mapMetaCache.has(workUrl) ? mapMetaCache.get(workUrl) : undefined;
      }
      if((needFill || needCoords) && meta === undefined){
        try { meta = await fetchMapMeta(workUrl); } catch { meta = null; }
      }
      if(needFill && meta && autoFillItemFromMeta(item, meta)){
        changed = true;
        filledItems++;
      }

      // 3) 若還沒有座標（map URL 沒座標且 item.lat/lng 也沒），用地址/店名補
      // 策略：用 Jina Reader markdown 抓到的 title/addr → Photon (多 query 嘗試) → Nominatim fallback
      // 重要：只把座標塞到 item.lat/lng，**不改寫 item.map**，保留原 URL 的店名地址資訊給 iframe 顯示 Place 面板
      const hasCoordsNow = mapHasCoords(item.map) ||
        (typeof item.lat === 'number' && typeof item.lng === 'number');
      if(!hasCoordsNow){
        const title = meta?.title || item.maps_label || item.name || '';
        const addr = meta?.addr || item.address || '';
        const region = inferRegionHint(addr || title);
        const hintLL = region?.ll;

        const cleanAddr = addr
          .replace(/^\s*Japan,?\s*/i, '')
          .replace(/^〒\s*\d{3}[-－\d]+\s*/, '')
          .replace(/\s+/g, ' ')
          .trim();

        const queries = [];
        if(cleanAddr) queries.push(cleanAddr);
        if(title && cleanAddr) queries.push(`${title}, ${cleanAddr}`);
        if(title && region?.name) queries.push(`${title}, ${region.name}`);
        if(title) queries.push(title);

        let ll = null;
        for(const q of queries){
          ll = await photonGeocode(q, hintLL);
          if(ll) break;
        }
        if(!ll && queries.length){
          ll = await geocodeAddress(queries[0]);
        }
        if(ll){
          item.lat = ll.lat;
          item.lng = ll.lng;
          changed = true;
          geocoded++;
        }
      }
    })());
  };

  (state.data.days||[]).forEach(d => (d.stops||[]).forEach(walk));
  (state.data.stay_groups||[]).forEach(g => (g.items||[]).forEach(walk));
  (state.data.shop_groups||[]).forEach(g => (g.items||[]).forEach(walk));

  if(!tasks.length) return;
  setStatus('地圖資訊解析中…');
  await Promise.all(tasks);
  if(changed){
    saveData();
    renderAll();
    const parts = [];
    if(resolvedShort) parts.push(`解析短網址 ${resolvedShort}`);
    if(geocoded) parts.push(`補座標 ${geocoded}`);
    if(filledItems) parts.push(`自動填欄位 ${filledItems}`);
    setStatus(parts.length ? `地圖資訊更新：${parts.join('、')}` : '地圖資訊已更新');
  } else if(failedShort.length){
    setStatus('短網址解析失敗（CORS proxy 都失敗，請改用 HTTP server 或手動貼長網址）');
    console.warn('[ShortUrl] 解析失敗的 URL：', failedShort);
  }
}

async function fetchPageTitle(url){
  const html = await fetchHtmlViaProxy(url);
  if(!html) return null;
  let m = html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)
       || html.match(/<meta[^>]+name=["']og:title["'][^>]+content=["']([^"']+)["']/i)
       || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i);
  if(m) return decodeEntities(m[1]).trim().slice(0, 200);
  m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  if(m) return decodeEntities(m[1]).replace(/\s+/g, ' ').trim().slice(0, 200);
  return null;
}

const titleFetchInFlight = new Set();
async function fetchTitleAsync(url){
  if(titleFetchInFlight.has(url)) return;
  titleFetchInFlight.add(url);
  try {
    const title = await fetchPageTitle(url);
    if(!title) return;
    if(!state.data?.references) return;
    const ref = state.data.references.find(r => r.url === url && !r.titleManual);
    if(ref){
      ref.title = title;
      saveData();
      if(state.activeMain === 'reference') renderReferencePanel();
    }
  } catch {} finally {
    titleFetchInFlight.delete(url);
  }
}

// 同步：保留 manual refs，重建 auto refs (依 stops 內容)
function syncReferences(){
  if(!state.data) return;
  state.data.references = state.data.references || [];

  const stopUrls = collectUrlsFromStops();
  const seen = new Set();
  const unique = [];
  stopUrls.forEach(u => {
    if(seen.has(u.url)) return;
    seen.add(u.url);
    unique.push(u);
  });

  const manualRefs = state.data.references.filter(r => r.source === 'manual');
  const existingAutoMap = new Map();
  state.data.references.filter(r => r.source !== 'manual').forEach(r => existingAutoMap.set(r.url, r));

  const newAutoRefs = unique.map(u => {
    const existing = existingAutoMap.get(u.url);
    if(existing){
      existing.stopRef = `day:${u.dayKey}:${u.idx}`;
      existing.stopName = u.stopName;
      existing.source = 'auto';
      return existing;
    }
    return { url: u.url, title: '', source: 'auto', stopRef: `day:${u.dayKey}:${u.idx}`, stopName: u.stopName };
  });

  state.data.references = [...manualRefs, ...newAutoRefs];

  // 啟動 title 抓取 (尚未有 title 的)
  state.data.references.forEach(r => { if(!r.title && !r.titleManual) fetchTitleAsync(r.url); });
}

function renderReferencePanel(){

  const addBox = document.createElement('div');
  addBox.className = 'ref-add';
  addBox.innerHTML = `
    <input type="text" id="refNewTitle" class="ref-title-input" placeholder="標題（選填，留空會自動抓取）">
    <input type="url" id="refNewUrl" placeholder="貼上完整網址 https://...">
    <button type="button" class="btn" id="refAddBtn">＋ 加入</button>
  `;
  cont.appendChild(addBox);

  // 提示：自動抓取失敗時可手動填
  const hint = document.createElement('div');
  hint.className = 'ref-hint';
  hint.textContent = '標題會自動從網站抓取。若網站擋爬蟲（如 403 Forbidden 或 CORS 失敗），可直接在左邊欄位手動填寫，或加入後點卡片右上角鉛筆圖示編輯。';
  cont.appendChild(hint);

  const doAdd = async () => {
    const input = $('#refNewUrl');
    const titleInput = $('#refNewTitle');
    const url = (input.value||'').trim();
    const manualTitle = (titleInput.value||'').trim();
    if(!url) return;
    if(!/^https?:\/\//i.test(url)){ alert('請輸入完整 URL（含 http:// 或 https://）'); return; }
    state.data.references = state.data.references || [];
    if(state.data.references.find(r => r.url === url)){ alert('此網站已存在於列表'); return; }
    // 有填手動標題 → titleManual=true，後續自動抓取不會覆蓋
    const ref = { url, title: manualTitle, source: 'manual', titleManual: !!manualTitle };
    state.data.references.unshift(ref);
    saveData();
    input.value = '';
    titleInput.value = '';
    renderReferencePanel();
    if(!manualTitle) fetchTitleAsync(url);
  };
  $('#refAddBtn').addEventListener('click', doAdd);
  $('#refNewUrl').addEventListener('keydown', e => { if(e.key === 'Enter') doAdd(); });
  $('#refNewTitle').addEventListener('keydown', e => { if(e.key === 'Enter') doAdd(); });

  const refs = state.data.references || [];
  if(!refs.length){
    cont.appendChild(Object.assign(document.createElement('div'), {
      className:'empty',
      textContent:'尚無參考網站。手動加入，或在每日行程的 link / 備註中貼上網址都會自動同步至此。'
    }));
    return;
  }

  const list = document.createElement('div');
  list.className = 'list';
  list.style.marginTop = '14px';
  cont.appendChild(list);

  refs.forEach((ref, idx) => {
    const editId = `ref:${idx}`;
    if(state.editing === editId){
      list.appendChild(buildEditForm(
        [
          {key:'title', label:'標題（清空可重新自動抓取）'},
          {key:'url', label:'網址（http:// 或 https:// 開頭）'}
        ],
        ref,
        v => {
          const newUrl = (v.url||'').trim();
          const newTitle = (v.title||'').trim();
          if(!newUrl){ alert('網址不能為空'); return; }
          if(!/^https?:\/\//i.test(newUrl)){ alert('請輸入完整 URL（含 http:// 或 https://）'); return; }
          // 撞到別筆相同網址 → 拒絕
          if(newUrl !== ref.url && (state.data.references||[]).some((r, i) => i !== idx && r.url === newUrl)){
            alert('此網址已存在於列表');
            return;
          }
          mutate(d => {
            const r = d.references[idx];
            const urlChanged = newUrl !== r.url;
            r.url = newUrl;
            r.title = newTitle;
            r.titleManual = nonEmpty(newTitle);
            // 改了 url 就轉為 manual，避免 syncReferences 依舊 url 比對把它視為失效而刪除
            if(urlChanged){
              r.source = 'manual';
              delete r.stopRef;
              delete r.stopName;
            }
            state.editing = null;
            if(!nonEmpty(newTitle)) fetchTitleAsync(newUrl);
          });
        }
      ));
      return;
    }

    const card = document.createElement('div');
    card.className = 'item-card ref-card';
    card.dataset.editId = `ref:${idx}`;
    card.title = '點擊開啟網站';
    const isAuto = ref.source !== 'manual';
    const sourceLabel = isAuto
      ? `🔗 自動偵測${ref.stopName ? '：' + ref.stopName : ''}`
      : '✋ 手動加入';
    const displayTitle = ref.title || `<span class="ref-loading">（讀取標題中…${ref.url.slice(0, 60)}）</span>`;
    card.innerHTML = `
      <div><span class="ref-source ${isAuto?'auto':'manual'}">${escapeHtml(sourceLabel)}</span></div>
      <div class="ref-title" style="margin-top:6px"><a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener noreferrer">${ref.title ? escapeHtml(ref.title) : displayTitle}</a></div>
      <div class="ref-url">${escapeHtml(ref.url)}</div>
    `;
    // 整張卡片可點擊跳轉（忽略工具列按鈕、表單、a 連結等子元素的冒泡）
    card.addEventListener('click', e => {
      if(e.target.closest('.icon-btn, button, input, textarea, .edit-form, a')) return;
      window.open(ref.url, '_blank', 'noopener,noreferrer');
    });
    card.appendChild(makeToolbar({
      onEdit: () => { state.editing = editId; renderAll(); },
      onDelete: () => {
        mutate(d => {
          d.references.splice(idx, 1);
          state.editing = null;
        });
      }
    }));
    list.appendChild(card);
  });
}

// ============== 地點收藏夾 (Google Maps List) ==============
// Google Maps 清單頁經過 Jina Reader 後的 markdown 格式：
//   ## {user} · {N} places · {Shared/Saved} list
//   ![Image N](anchor-url)
//   地點名稱
//   4.5            <- 可選評分
//   餐廳類型       <- 可選類型
//   可選的備註文字
//   ![Image N+1](anchor-url)
//   ...
// 清單頁「完全沒有座標」，所以我們 parse 出名稱後再用 geocode 補座標。
function parseGoogleMapsList(md){
  if(!md) return { title: '', places: [] };
  const text = String(md).replace(/\r/g, '');

  // 收藏夾標題：第一個 # 非 "Google Maps"
  let title = '';
  const tMatches = text.match(/(?:^|\n)#\s+([^\n]+)/g);
  if(tMatches){
    for(const tm of tMatches){
      const t = tm.replace(/^[\s\n]*#\s+/, '').replace(/\s*[-–—]\s*Google Maps\s*$/i, '').trim();
      if(t && !/^Google Maps$/i.test(t)){ title = t; break; }
    }
  }

  // 從 "## xxx · N places · Shared/Saved list" 開始才是地點區
  let startIdx = 0;
  const sharedMatch = text.match(/##\s*[^\n]*·\s*\d+\s*places?\s*·\s*(?:Shared|Saved|Your)[^\n]*list/i);
  if(sharedMatch) startIdx = sharedMatch.index + sharedMatch[0].length;

  const body = text.slice(startIdx);
  const lines = body.split('\n');

  // 地點 anchor image（包含 result-no-thumbnail / /places/ / /gps-cs 都算地點）
  const placeImageRe = /^!\[Image \d+\]\(https?:\/\/[^)]*(?:result-no-thumbnail|\/places\/|\/gps-cs|\/p\/[A-Za-z0-9_-]{10,})[^)]*\)$/;
  // 任何 image（用來區分非地點 image，例如 loader / Google logo）
  const anyImageRe = /^!\[Image \d+\]\([^)]+\)$/;
  // 結束標誌
  const endRe = /^(Saved|Collapse side panel|Search Google Maps|Back$|Share$|Save$|Close$|Loading$)/i;
  // 忽略的樣板字（按鈕、UI 文字）
  const skipRe = /^(Save|Share|Back|Search|Close|Loading|Recents|Get app|Search Google Maps|Saved|Collapse)$/i;

  const places = [];
  let cur = null;
  let linesSinceAnchor = 0;

  const push = () => {
    if(cur && cur.name && !skipRe.test(cur.name)) places.push(cur);
    cur = null;
  };

  for(let i = 0; i < lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue;

    // 地點 anchor → 開始新 entry
    if(placeImageRe.test(line)){
      push();
      cur = { name: '', rating: '', type: '', note: '' };
      linesSinceAnchor = 0;
      continue;
    }
    // 其他 image 行 → 忽略（不重置 cur）
    if(anyImageRe.test(line)) continue;
    // 結束
    if(endRe.test(line)){ push(); break; }
    // 忽略 UI 按鈕文字
    if(skipRe.test(line)) continue;

    if(!cur) continue;
    linesSinceAnchor++;

    if(linesSinceAnchor === 1){
      cur.name = line;
    } else if(linesSinceAnchor === 2){
      if(/^\d+(\.\d+)?$/.test(line)) cur.rating = line;
      else cur.type = line;
    } else if(linesSinceAnchor === 3){
      if(!cur.type) cur.type = line;
      else cur.note = (cur.note ? cur.note + ' ' : '') + line;
    } else {
      cur.note = (cur.note ? cur.note + ' ' : '') + line;
    }
  }
  push();

  return { title, places };
}

// Fallback：詳情頁 (單一地點) 會含 !3d!4d，維持原本 parser 當備案
function parseFavoritesFromMarkdown(md){
  const listResult = parseGoogleMapsList(md);
  if(listResult.places.length > 0) return listResult;

  // 老 parser（詳情頁）
  if(!md) return { title: '', places: [] };
  const text = String(md).replace(/\r/g, '');
  let title = listResult.title;

  const places = [];
  const seen = new Set();
  const coordRe = /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g;
  let m;
  while((m = coordRe.exec(text))){
    const lat = parseFloat(m[1]);
    const lng = parseFloat(m[2]);
    if(isNaN(lat) || isNaN(lng)) continue;
    const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;
    if(seen.has(key)) continue;
    seen.add(key);
    const before = text.slice(Math.max(0, m.index - 800), m.index);
    let name = '';
    const linkMatches = [...before.matchAll(/\[([^\]]{2,80})\]\(https?:[^)]+\)/g)];
    for(let i = linkMatches.length - 1; i >= 0; i--){
      const cand = linkMatches[i][1].trim();
      if(cand && !/^https?:|^image|^\d+$|^more$|^share$|^directions$/i.test(cand)){ name = cand; break; }
    }
    if(!name){
      const hMatch = [...before.matchAll(/(?:^|\n)#{2,4}\s+([^\n]+)/g)].pop();
      if(hMatch) name = hMatch[1].replace(/\s*[-–—]\s*Google Maps\s*$/i, '').trim();
    }
    if(!name) name = `地點 ${places.length + 1}`;
    places.push({ name, lat, lng });
  }
  return { title, places };
}

// ===== 原始 HTML proxy（會返回「未經 markdown 化」的原始 HTML / JSON）=====
// 會 follow redirect 且不會被 Google CAPTCHA 擋的關鍵：Jina Reader 的 X-Return-Format: html 模式
async function fetchRawViaProxy(url){
  const mkOpts = () => {
    const o = {};
    try { if(typeof AbortSignal !== 'undefined' && AbortSignal.timeout) o.signal = AbortSignal.timeout(25000); } catch {}
    return o;
  };
  const attempts = [
    // Jina Reader html 模式：會執行 JS + follow redirect，回傳完整原始 HTML（非 markdown）。
    // 若原始回應是 JSON/plain text，Jina 會用 <pre> 包裹；我們下面會取出來還原。
    { name: 'jina-html', fn: async () => {
      const r = await fetch(`https://r.jina.ai/${url}`, {
        ...mkOpts(),
        headers: { 'X-Return-Format': 'html' }
      });
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      let text = await r.text();
      const pre = text.match(/<pre[^>]*>([\s\S]*?)<\/pre>/);
      if(pre){
        const inner = pre[1];
        // 如果 <pre> 裡只是純 JSON / text 而不是嵌套的 HTML，取出來還原 entity
        if(!/<html[\s>]/i.test(inner.slice(0, 200)) && !/<link\s/i.test(inner.slice(0, 200))){
          text = inner
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"').replace(/&#39;/g, "'");
        }
      }
      return text;
    }},
    { name: 'allorigins-raw', fn: async () => {
      const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }},
    { name: 'allorigins', fn: async () => {
      const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, mkOpts());
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json();
      return (j && j.contents) || null;
    }},
    { name: 'corsproxy', fn: async () => {
      const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }},
    { name: 'codetabs', fn: async () => {
      // trailing slash 才對：codetabs 會 301 到 /proxy/?quest=...
      const r = await fetch(`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }},
    { name: 'thingproxy', fn: async () => {
      const r = await fetch(`https://thingproxy.freeboard.io/fetch/${url}`, mkOpts());
      if(r.ok) return await r.text();
      throw new Error(`HTTP ${r.status}`);
    }}
  ];
  for(const a of attempts){
    try {
      const result = await a.fn();
      if(result && result.length > 500){  // 太短多半是 error page 或 captcha
        console.info(`[RawProxy] ${a.name} OK，長度 ${result.length}`);
        return result;
      }
      if(result) console.warn(`[RawProxy] ${a.name} 回傳過短(${result.length})，可能被擋，試下一個`);
    } catch(e){
      console.warn(`[RawProxy] ${a.name} 失敗:`, e.message || e);
    }
  }
  return null;
}

// ===== 從 Google Maps 分享清單短網址抓「Google 原始資料」=====
// 原理：Google Maps shared list 頁面的 HTML 裡 preload 了一個內部 API
// /maps/preview/entitylist/getlist?pb=... 它會回傳完整的地點陣列（包含精確座標、店名、地址）。
// 直接打這支 API → 100% 用 Google 的資料，不用 geocoding 猜測，Kingdom 也會是使用者真正收藏的那家。
async function fetchGoogleMapsListData(shortOrShareUrl){
  const html = await fetchRawViaProxy(shortOrShareUrl);
  if(!html){ console.warn('[GoogleList] 抓不到 HTML'); return null; }

  // 抽 /maps/preview/entitylist/getlist?... URL（HTML 裡 &amp; 要還原）
  const m = html.match(/["'](\/maps\/preview\/entitylist\/getlist\?[^"']+)["']/);
  if(!m){ console.warn('[GoogleList] HTML 裡沒有 entitylist URL（可能是私人清單或格式變更）'); return null; }
  const apiPath = m[1].replace(/&amp;/g, '&');
  const apiUrl = 'https://www.google.com' + apiPath;

  const raw = await fetchRawViaProxy(apiUrl);
  if(!raw){ console.warn('[GoogleList] 抓不到 API 回應'); return null; }

  const jsonText = raw.replace(/^\)\]\}'\s*/, '').trim();
  let data;
  try { data = JSON.parse(jsonText); }
  catch(e){ console.warn('[GoogleList] JSON parse 失敗', e); return null; }

  // 遞迴找 place node: [null, details_array, name_string, ...]
  // details_array 裡會有 [null, null, lat, lng]
  const places = [];
  const seen = new Set();
  function walk(node){
    if(!Array.isArray(node)) return;
    if(node.length >= 3 && node[0] === null && Array.isArray(node[1]) && typeof node[2] === 'string'){
      const d = node[1];
      for(let i = 0; i < d.length; i++){
        const x = d[i];
        if(Array.isArray(x) && x.length >= 4 && x[0] === null && x[1] === null &&
           typeof x[2] === 'number' && typeof x[3] === 'number' &&
           Math.abs(x[2]) <= 90 && Math.abs(x[3]) <= 180){
          const key = `${x[2].toFixed(5)},${x[3].toFixed(5)}`;
          if(seen.has(key)) return;
          seen.add(key);
          const addrEn = (typeof d[2] === 'string' && d[2]) || '';
          const addrLocal = (typeof d[4] === 'string' && d[4]) || '';
          const address = addrLocal || addrEn || '';
          const placeId = (typeof d[7] === 'string' && d[7].startsWith('/g/')) ? d[7] : '';
          places.push({ name: node[2], address, lat: x[2], lng: x[3], placeId });
          return;
        }
      }
    }
    for(const c of node) walk(c);
  }
  walk(data);

  // 找 collection title：在 owner info array 後的字串（depth-first）
  let title = '';
  function findTitle(node, depth){
    if(title || depth > 5 || !Array.isArray(node)) return;
    for(let i = 0; i < node.length - 1; i++){
      const v = node[i];
      if(Array.isArray(v) && v.length >= 3 &&
         typeof v[0] === 'string' && typeof v[1] === 'string' &&
         /googleusercontent/.test(v[1]) && typeof v[2] === 'string'){
        const next = node[i+1];
        if(typeof next === 'string' && next.length > 0 && next.length < 200){
          title = next;
          return;
        }
      }
    }
    for(const c of node) findTitle(c, depth+1);
  }
  findTitle(data, 0);

  return { title, places };
}

// ===== Photon (komoot) geocoding：比 Nominatim 快、無 rate limit，OSM 資料 =====
async function photonGeocode(query, hintLatLng){
  if(!query) return null;
  try {
    let url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=1`;
    if(hintLatLng) url += `&lat=${hintLatLng.lat}&lon=${hintLatLng.lng}`;
    const r = await fetch(url);
    if(!r.ok) return null;
    const j = await r.json();
    const f = j?.features?.[0];
    if(f?.geometry?.coordinates){
      return { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
    }
  } catch(e){}
  return null;
}

// 從收藏夾標題 / 名字推斷地區 hint（lat/lng 和字串）
function inferRegionHint(title){
  const t = String(title || '');
  const map = [
    { re: /京都|kyoto/i, name: 'Kyoto, Japan', ll: { lat: 35.0116, lng: 135.7681 } },
    { re: /大阪|osaka/i, name: 'Osaka, Japan', ll: { lat: 34.6937, lng: 135.5023 } },
    { re: /東京|tokyo/i, name: 'Tokyo, Japan', ll: { lat: 35.6762, lng: 139.6503 } },
    { re: /奈良|nara/i, name: 'Nara, Japan', ll: { lat: 34.6851, lng: 135.8048 } },
    { re: /神戶|神户|kobe/i, name: 'Kobe, Japan', ll: { lat: 34.6901, lng: 135.1955 } },
    { re: /北海道|hokkaido|札幌|sapporo/i, name: 'Sapporo, Japan', ll: { lat: 43.0618, lng: 141.3545 } },
    { re: /沖繩|沖縄|okinawa/i, name: 'Okinawa, Japan', ll: { lat: 26.2124, lng: 127.6809 } },
    { re: /福岡|fukuoka/i, name: 'Fukuoka, Japan', ll: { lat: 33.5904, lng: 130.4017 } },
    { re: /台北|taipei/i, name: 'Taipei, Taiwan', ll: { lat: 25.0330, lng: 121.5654 } },
    { re: /日本|japan/i, name: 'Japan', ll: { lat: 36.2048, lng: 138.2529 } },
    { re: /台灣|台湾|taiwan/i, name: 'Taiwan', ll: { lat: 23.6978, lng: 120.9605 } }
  ];
  for(const m of map){ if(m.re.test(t)) return m; }
  return { name: 'Japan', ll: { lat: 36.2048, lng: 138.2529 } };
}

// 批次對 favorites.places 做 geocoding，並行 worker 5 個，逐步更新 UI
async function geocodeFavoritesPlaces(){
  const fav = state.data?.favorites;
  if(!fav || !fav.places?.length) return;
  const hint = inferRegionHint(fav.title);

  let doneCount = 0;
  const renderIfActive = () => {
    if(state.activeMain === 'map' && state.activeMapSub === 'favorites'){
      renderMapPanel();
    }
  };

  const worker = async () => {
    while(true){
      const task = fav.places.find(p => !(p.lat && p.lng) && !p._processing && !p._tried);
      if(!task) break;
      task._processing = true;
      // 先用「name + 地區」，失敗再試「name」
      let ll = await photonGeocode(`${task.name}, ${hint.name}`, hint.ll);
      if(!ll) ll = await photonGeocode(task.name, hint.ll);
      if(ll){ task.lat = ll.lat; task.lng = ll.lng; }
      task._tried = true;
      delete task._processing;
      doneCount++;
      if(doneCount % 3 === 0) renderIfActive();
    }
  };

  fav.geocoding = true;
  renderIfActive();
  await Promise.all(Array.from({ length: 5 }, () => worker()));
  fav.places.forEach(p => { delete p._processing; delete p._tried; });
  fav.geocoding = false;
  saveData();
  renderIfActive();
}

async function loadFavoritesFromUrl(url){
  if(!url) return;
  if(!/^https?:\/\//i.test(url)){ alert('請輸入完整的 Google Maps 收藏夾網址'); return; }
  state.data.favorites = state.data.favorites || { url: '', title: '', places: [] };
  state.data.favorites.url = url;
  state.data.favorites.loading = true;
  state.data.favorites.error = '';
  saveData();
  if(state.activeMapSub === 'favorites') renderMapPanel();

  // ---- 第一路線：直接打 Google 內部 entitylist API，拿到 100% 精確的資料 ----
  try {
    const gData = await fetchGoogleMapsListData(url);
    if(gData && gData.places.length > 0){
      state.data.favorites.title = gData.title || '(未命名收藏夾)';
      state.data.favorites.places = gData.places.map(p => ({
        name: p.name,
        address: p.address || '',
        lat: p.lat,
        lng: p.lng,
        placeId: p.placeId || ''
      }));
      state.data.favorites.source = 'google';
      state.data.favorites.loading = false;
      state.data.favorites.error = '';
      state.data.favorites.fetchedAt = new Date().toISOString();
      state.favoritesFocus = null;
      saveData();
      if(state.activeMapSub === 'favorites') renderMapPanel();
      return;
    }
    console.warn('[Favorites] Google API 沒拿到地點，改用備援方案');
  } catch(e){
    console.warn('[Favorites] Google API 失敗，改用備援方案:', e);
  }

  // ---- 備援路線：Jina Reader markdown + 名稱 geocoding ----
  try {
    const md = await fetchMapHtmlCached(url);
    if(!md){
      state.data.favorites.loading = false;
      state.data.favorites.error = '抓取失敗（所有 CORS proxy 都無回應）。請稍後再試或改用本機 HTTP server。';
      saveData();
      if(state.activeMapSub === 'favorites') renderMapPanel();
      return;
    }
    const parsed = parseFavoritesFromMarkdown(md);
    state.data.favorites.title = parsed.title || '(未命名收藏夾)';
    // 保留舊資料的座標（以名字為 key） - 若之前已 geocode 過，不用重查
    const oldMap = new Map();
    (state.data.favorites.places || []).forEach(p => {
      if(p.name && p.lat && p.lng) oldMap.set(p.name, { lat: p.lat, lng: p.lng });
    });
    state.data.favorites.places = parsed.places.map(p => {
      const cached = oldMap.get(p.name);
      return cached ? { ...p, ...cached } : p;
    });
    state.data.favorites.source = 'fallback';
    state.data.favorites.loading = false;
    state.data.favorites.fetchedAt = new Date().toISOString();
    state.favoritesFocus = null;
    if(parsed.places.length === 0){
      state.data.favorites.error = '抓不到 Google 原始資料，備援方案也沒解析出地點。請確認連結是公開清單或稍後重試。';
    } else {
      state.data.favorites.error = '已使用備援解析（Google 原始 API 無法連上）。地點數量與座標可能不完整、不精確。';
    }
    saveData();
    if(state.activeMapSub === 'favorites') renderMapPanel();

    if(parsed.places.length > 0) geocodeFavoritesPlaces();
  } catch(e){
    state.data.favorites.loading = false;
    state.data.favorites.error = '錯誤：' + (e.message || e);
    saveData();
    if(state.activeMapSub === 'favorites') renderMapPanel();
  }
}

function renderFavoritesSubTab(container){

  const parts = [];
  if(fav.source === 'google') parts.push('<span style="color:#047857;font-weight:700">✓ 已從 Google Maps 取得精確資料（店名、座標、地址）</span>');

  if(!fav.places?.length){
    if(!fav.loading && !fav.error){
      const empty = document.createElement('div');

      empty.innerHTML = `
        ① 打開 Google Maps，進入你的清單/收藏夾<br>
        ② 點「分享」→「複製連結」得到 https://maps.app.goo.gl/xxxxx<br>

      const card = document.createElement('div');
      card.className = 'fav-place';
      card.dataset.idx = i;
      const hasCoord = !!(p.lat && p.lng);
      // 用「經緯度 + 店名」格式 → Google Maps 會精準顯示該店（因為座標是 Google 原始資料）
      const gmapsUrl = hasCoord
        ? `https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${p.lat},${p.lng},17z`
        : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + (p.type?' '+p.type:''))}`;
      card.innerHTML = `
        <div>
          <span class="fav-place-idx">${i+1}</span>
          <span class="fav-place-name">${escapeHtml(p.name)}</span>
          ${p.rating ? `<span class="muted small" style="margin-left:6px">⭐ ${escapeHtml(p.rating)}</span>` : ''}
        </div>
        ${p.address ? `<div class="fav-place-addr">📍 ${escapeHtml(p.address)}</div>` : ''}
        ${p.type ? `<div class="fav-place-addr">🏷 ${escapeHtml(p.type)}</div>` : ''}
        ${p.note ? `<div class="fav-place-addr">📝 ${escapeHtml(p.note)}</div>` : ''}
        ${!hasCoord ? `<div class="fav-place-addr" style="color:#b45309">⚠ ${fav.geocoding ? '座標查詢中…' : '未能自動定位'}</div>` : ''}

        if(!hasCoord) return;

    });

    const u = container.querySelector('#favUrlInput').value.trim();
    loadFavoritesFromUrl(u);
  });
  container.querySelector('#favUrlInput')?.addEventListener('keydown', e => {
    if(e.key === 'Enter') loadFavoritesFromUrl(e.target.value.trim());
  });
  container.querySelector('#favClearBtn')?.addEventListener('click', () => {
    if(!confirm('確定清除已載入的收藏夾？')) return;
    delete state.data.favorites;
    state.favoritesFocus = null;
    saveData();
    renderMapPanel();
  });
}

// 在「地圖資訊」主 Leaflet 地圖上顯示收藏夾所有地點
// 切進 favorites 模式時會把地圖放大 (fav-canvas class)；切出會移除
function showFavoritesOnMainMap(){
  const fav = state.data.favorites;
  const focus = $('#mapFocus');

  if(!fav || !fav.places?.length){
    useGoogleIframe();
    $('#mapFrame').src = embedUrl('日本');
    focus.innerHTML = '<div class="muted">貼入收藏夾網址讀取後，地點會顯示在這張地圖上</div>';
    return;
  }
  const withCoords = fav.places.filter(p => p.lat && p.lng);
  if(!withCoords.length){
    useGoogleIframe();
    $('#mapFrame').src = embedUrl(fav.title || '日本');
    focus.innerHTML = `<div class="muted">共 ${fav.places.length} 個地點，正在查詢座標…</div>`;
    return;
  }
  const map = ensureLeafletInit();
  if(!map){
    useGoogleIframe();
    return;
  }
  setMapMode('leaflet');
  if(leafletLayer) leafletLayer.clearLayers();

  const points = [];
  const markerMap = new Map();
  // 收藏夾：用原始 fav.places 的順序當編號（跳過沒座標的也保留編號跳號），
  // first/last 視覺：第一/最後 *有座標* 的 marker
  const favValid = fav.places.map((p, i) => ({ p, i })).filter(x => x.p.lat && x.p.lng);
  favValid.forEach(({ p, i }, vi) => {
    const num = i + 1;
    const isFirst = vi === 0;
    const isLast = vi === favValid.length - 1;
    const marker = L.marker([p.lat, p.lng], { icon: makeNumberedMarker(num, isFirst, isLast) });
    const gmapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${p.lat},${p.lng},17z`;
    marker.bindPopup(`
      <div class="pop-title">${num}. ${escapeHtml(p.name)}</div>
      ${p.address ? `<div class="pop-meta">📍 ${escapeHtml(p.address)}</div>` : ''}
      ${p.type ? `<div class="pop-meta">🏷 ${escapeHtml(p.type)}</div>` : ''}
      ${p.rating ? `<div class="pop-meta">⭐ ${escapeHtml(p.rating)}</div>` : ''}
      <div style="margin-top:6px"><a href="${escapeHtml(gmapsUrl)}" target="_blank" rel="noopener noreferrer">在 Google Maps 開啟</a></div>
    `);
    marker.addTo(leafletLayer);
    markerMap.set(i, marker);
    points.push([p.lat, p.lng]);
  });

  // 先 invalidateSize 確保拿到正確的容器尺寸，再 fitBounds 才算得準
  const applyView = () => {
    map.invalidateSize();
    if(state.favoritesFocus != null && markerMap.has(state.favoritesFocus)){
      const fp = fav.places[state.favoritesFocus];
      map.setView([fp.lat, fp.lng], 16);
      setTimeout(() => markerMap.get(state.favoritesFocus).openPopup(), 150);
    } else if(points.length === 1){
      map.setView(points[0], 14);
    } else if(points.length > 1){
      map.fitBounds(L.latLngBounds(points), { padding: [50, 50], maxZoom: 13 });
    }
  };
  // Leaflet 內部排版 & CSS height 的 transition 要點時間，延遲套用
  setTimeout(applyView, 120);

  focus.innerHTML = `
    <div class="small muted">Google Maps 收藏夾</div>
    <h3 style="margin:6px 0">${escapeHtml(fav.title)}</h3>
    <div class="muted small">共 ${fav.places.length} 個地點，已定位 ${withCoords.length}${fav.geocoding ? '（查詢中…）' : ''}</div>
    ${withCoords.length < fav.places.length && !fav.geocoding ? '<div class="muted small" style="margin-top:6px">⚠ 部分地點未能自動定位（名稱可能不夠明確）</div>' : ''}
    <div class="actions" style="margin-top:10px">
      <button type="button" class="btn secondary" id="favShowAllBtn">🗺 顯示全部 ${withCoords.length} 個地點</button>
    </div>
  `;
  $('#favShowAllBtn')?.addEventListener('click', () => {
    state.favoritesFocus = null;
    applyView();
  });
  state.currentMapId = '';
}

// 預設 trip.json 來源：寫死指向 GitHub jp2026 分支的 raw 檔
// 這樣不管在哪個網域、本機 file:// 或其他 origin 打開，都能讀到最新內容
const DEFAULT_TRIP_URL = 'https://raw.githubusercontent.com/eithwa/travel-notes/jp2026/trip.json';

async function loadDefaultJson(){
  // 依序嘗試：同 origin 的相對路徑（部署在 jp2026 時最快） → GitHub raw（保底，全球可用）
  const candidates = [];
  try{ candidates.push(new URL('trip.json', document.baseURI).href); }catch(e){}
  if(!candidates.includes(DEFAULT_TRIP_URL)) candidates.push(DEFAULT_TRIP_URL);

  for(const url of candidates){
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const parsed = await res.json();
      setData(parsed);
      setStatus(url === DEFAULT_TRIP_URL ? '目前使用 GitHub jp2026 的 trip.json' : '目前使用預設 trip.json');
      return;
    }catch(err){
      console.warn('載入 ' + url + ' 失敗：', err);
    }
  }
  setStatus('預設 trip.json 載入失敗（請檢查網路連線）');
}

async function loadJsonFile(file){
  if(!file) return;
  if(!/\.json$/i.test(file.name) && file.type && !file.type.includes('json')){
    setStatus('檔案不是 JSON');
    return;
  }
  try{
    const txt = await file.text();
    const parsed = JSON.parse(txt);
    setData(parsed);
    setStatus('已載入：' + file.name);
  }catch(err){
    console.error(err);
    setStatus('JSON 讀取失敗');
    alert('JSON 讀取失敗，請確認格式正確。');
  }
}

function exportJson(){
  if(!state.data){ alert('沒有資料可匯出'); return; }
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trip.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setStatus('已匯出 trip.json');
}

  document.body.classList.toggle('edit-mode', state.editMode);
  renderAll();
});
$('#heroEditBtn').addEventListener('click', () => {
  state.editing = (state.editing === 'trip') ? null : 'trip';
  renderAll();
  if(state.editing === 'trip'){
    $('#tripEditContainer').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
});
$('#heroCollapseBtn').addEventListener('click', () => {
  state.heroCollapsed = !state.heroCollapsed;
  saveHeroCollapsed();
  renderHero();
});

const dropzone = $('#dropzone');
['dragenter','dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', e => {
  const f = [...(e.dataTransfer?.files||[])].find(x => /\.json$/i.test(x.name) || (x.type && x.type.includes('json')));
  loadJsonFile(f);
});

loadInitial();

/* ============== 手機版 UI 控制 ============== */
(function setupMobileUI(){
  const MQ = window.matchMedia('(max-width:640px)');
  const mDrawer = document.getElementById('mDrawer');
  const mOverlay = document.getElementById('mDrawerOverlay');
  const mClose = document.getElementById('mDrawerCloseBtn');
  const mMenuBtn = document.getElementById('mhMenuBtn');
  const mEditBtn = document.getElementById('mhEditBtn');
  const mTitle = document.getElementById('mhTitle');
  const mNav = document.getElementById('mDrawerNav');
  const mExtras = document.getElementById('mDrawerExtras');
  const heroActions = document.querySelector('.hero-actions');
  const heroContent = document.getElementById('heroContent');
  const editToggle = document.getElementById('editToggle');
  const titleEl = document.getElementById('title');

  // ---- 抽屜開關 ----
  function openDrawer(){
    mDrawer.hidden = false;
    requestAnimationFrame(() => mDrawer.classList.add('open'));
  }
  function closeDrawer(){
    mDrawer.classList.remove('open');
    setTimeout(() => { mDrawer.hidden = true; }, 260);
  }
  mMenuBtn?.addEventListener('click', openDrawer);
  mOverlay?.addEventListener('click', closeDrawer);
  mClose?.addEventListener('click', closeDrawer);

  // ---- 編輯模式快捷按鈕（觸發既有 editToggle） ----
  mEditBtn?.addEventListener('click', () => editToggle?.click());
  function syncEditBtn(){
    if(!mEditBtn || !editToggle) return;
    mEditBtn.classList.toggle('on', editToggle.classList.contains('on'));
  }
  if(editToggle){
    new MutationObserver(syncEditBtn).observe(editToggle, { attributes:true, attributeFilter:['class'] });
    syncEditBtn();
  }

  // ---- 同步 mobile header 標題 ----
  function syncTitle(){
    if(!mTitle || !titleEl) return;
    mTitle.textContent = titleEl.textContent || '旅遊筆記';
  }
  if(titleEl){
    new MutationObserver(syncTitle).observe(titleEl, { childList:true, characterData:true, subtree:true });
    syncTitle();
  }

  // ---- 把 main-tabs 鏡像到抽屜 nav ----
  function buildNav(){
    if(!mNav) return;
    mNav.innerHTML = '';
    document.querySelectorAll('#mainTabs .main-tab').forEach(tab => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'm-nav-btn';
      b.textContent = tab.textContent.trim();
      b.dataset.tab = tab.dataset.tab;
      b.addEventListener('click', () => {
        tab.click();
        closeDrawer();
      });
      mNav.appendChild(b);
    });
    syncNavActive();
  }
  function syncNavActive(){
    if(!mNav) return;
    mNav.querySelectorAll('.m-nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === state.activeMain);
    });
  }
  buildNav();
  // 監聽 main-tabs active 變化以同步 nav
  const mainTabsEl = document.getElementById('mainTabs');
  if(mainTabsEl){
    new MutationObserver(syncNavActive).observe(mainTabsEl, {
      subtree:true, attributes:true, attributeFilter:['class']
    });
  }

  // ---- 手機版佈局：把 hero-actions 移到抽屜，桌面版時移回 ----
  function applyLayout(){
    if(!heroActions || !mExtras || !heroContent) return;
    if(MQ.matches){
      if(heroActions.parentNode !== mExtras){
        mExtras.appendChild(heroActions);
        heroActions.classList.add('in-drawer');
      }
    } else {
      if(heroActions.parentNode !== heroContent){
        heroContent.appendChild(heroActions);
        heroActions.classList.remove('in-drawer');
      }
      // 確保切回桌面時抽屜是關的
      if(mDrawer){ mDrawer.classList.remove('open'); mDrawer.hidden = true; }
    }
  }
  applyLayout();
  MQ.addEventListener('change', applyLayout);

  // ---- Bottom sheet 三段拖曳吸附（折疊 / 半屏 / 全屏） ----
  // 拖曳感應區 = 整個 sheet，但排除「內容滾動區」(mapSubContent)，
  // 這樣 handle + sub-tabs 那一整塊都可以拖（類似 Google Maps），
  // 滾動內容時也不會誤觸拖曳。
  const sheet = document.getElementById('mapSide');
  const handle = document.getElementById('sheetHandle');
  const subContent = document.getElementById('mapSubContent');
  if(sheet && handle){
    const SNAPS = ['collapsed', 'half', 'full'];
    function snapHeights(){
      const winH = window.innerHeight;
      const headerH = 56;
      const available = winH - headerH;
      // collapsed 要保留 handle (22) + sub-tabs (~46) + 一些下緣空間 = 約 96px
      return {
        collapsed: 96,
        half: Math.round(available * 0.42),
        full: Math.round(available - 20),
      };
    }
    let currentSnap = 'half';
    function applySnap(snap){
      currentSnap = snap;
      const heights = snapHeights();
      sheet.style.height = heights[snap] + 'px';
      sheet.dataset.snap = snap;
      // 重新量地圖大小（leafletMap 是同 script scope 的 let 變數）
      if(typeof leafletMap !== 'undefined' && leafletMap){
        setTimeout(() => { try{ leafletMap.invalidateSize(); }catch{} }, 320);
      }
    }
    function nearestSnap(h){
      const heights = snapHeights();
      let best = 'half', diff = Infinity;
      for(const k of SNAPS){
        const d = Math.abs(heights[k] - h);
        if(d < diff){ diff = d; best = k; }
      }
      return best;
    }
    function nextSnap(s){
      const i = SNAPS.indexOf(s);
      return SNAPS[(i + 1) % SNAPS.length];
    }
    // 判斷此事件 target 是否落在「可拖曳區域」(handle + sub-tabs 列等)，
    // 不在 mapSubContent 滾動區內就算可拖
    function inDraggable(target){
      if(!target) return false;
      if(subContent && subContent.contains(target)) return false;
      return sheet.contains(target);
    }

    const DRAG_THRESHOLD = 6; // 移動超過 6px 才當作拖曳，避免誤觸
    let startY = 0, startH = 0, dragging = false, moved = false, startTarget = null;
    let suppressClick = false;

    function onStart(target, y){
      if(!MQ.matches) return;
      if(!inDraggable(target)) return;
      dragging = true; moved = false;
      startY = y;
      startH = sheet.getBoundingClientRect().height;
      startTarget = target;
      // 不立刻加 dragging class，等真正移動才加，避免影響短按
    }
    function onMove(y, ev){
      if(!dragging) return;
      const delta = startY - y;
      if(!moved && Math.abs(delta) > DRAG_THRESHOLD){
        moved = true;
        sheet.classList.add('dragging');
      }
      if(!moved) return;
      ev && ev.preventDefault && ev.preventDefault();
      const heights = snapHeights();
      const newH = Math.max(heights.collapsed, Math.min(heights.full, startH + delta));
      sheet.style.height = newH + 'px';
    }
    function onEnd(){
      if(!dragging) return;
      dragging = false;
      sheet.classList.remove('dragging');
      if(moved){
        const h = sheet.getBoundingClientRect().height;
        applySnap(nearestSnap(h));
        // 阻止隨後的 click 事件觸發 sub-tab 切換等
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 80);
      } else {
        // 沒移動 → 點擊在 handle 區的話切下一段，其它位置讓 click 正常傳播
        if(startTarget && handle.contains(startTarget)){
          applySnap(nextSnap(currentSnap));
        }
      }
      startTarget = null;
    }

    // 觸控
    sheet.addEventListener('touchstart', e => {
      onStart(e.target, e.touches[0].clientY);
    }, { passive: true });
    sheet.addEventListener('touchmove', e => onMove(e.touches[0].clientY, e), { passive: false });
    sheet.addEventListener('touchend', onEnd);
    sheet.addEventListener('touchcancel', onEnd);
    // 滑鼠（桌面 DevTools 模擬手機時測試用）
    sheet.addEventListener('mousedown', e => {
      if(!inDraggable(e.target)) return;
      onStart(e.target, e.clientY);
    });
    document.addEventListener('mousemove', e => onMove(e.clientY, e));
    document.addEventListener('mouseup', onEnd);

    // 拖曳結束後的 click 要被阻止，否則會誤觸發 sub-tab、卡片等
    sheet.addEventListener('click', e => {
      if(suppressClick){
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    // 視窗尺寸變化時重新套用 snap
    window.addEventListener('resize', () => {
      if(MQ.matches) applySnap(currentSnap);
    });

    // 初始：手機版套用 half；桌面版清掉 inline height 讓 CSS 接管
    function initSheet(){
      if(MQ.matches){
        applySnap('half');
      } else {
        sheet.style.height = '';
        sheet.removeAttribute('data-snap');
      }
    }
    initSheet();
    MQ.addEventListener('change', initSheet);
  }
})();
</script>
</body>
